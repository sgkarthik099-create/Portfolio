@media (hover:none){
 .card{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
 .card .glimpse{display:block!important;inset:auto 0 0!important;animation:none!important;transform:translateY(101%)!important;transition:transform .38s cubic-bezier(.2,.7,.1,1)!important}
 .card .glimpse li{animation:none!important;opacity:1!important;translate:0!important}
 .card .thumb-glimpse-img{animation:none!important}
 .card.peek .glimpse{transform:none!important}
}

.vx-label{margin:0 0 14px!important;font-size:.8rem!important;max-width:none!important;letter-spacing:.12em!important;text-transform:uppercase;font-weight:800!important;color:var(--lime);line-height:1.2!important}
@media (min-width:761px){.vx-stats{grid-template-columns:repeat(2,minmax(0,1fr))!important;max-width:720px}.vx-stats .stat{justify-content:flex-end}}

.vx-tl summary::-webkit-details-marker{display:none}
.vx-tl summary:hover,.vx-tl[open] summary{color:var(--lime)}
.vx-tl summary i{font-style:normal;font-size:.75rem;transition:transform .25s}
.vx-tl[open] summary i{transform:rotate(180deg)}
.vx-tl ol{list-style:none;margin:0;padding:6px 22px 24px 22px;border-top:1px solid var(--line);position:relative}
.vx-tl li{position:relative;display:grid;gap:2px;padding:16px 0 4px 30px}
.vx-tl li:before{content:"";position:absolute;left:4px;top:22px;width:11px;height:11px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 4px #d4f33f2e,0 0 14px #d4f33f80}
.vx-tl li:not(:last-child):after{content:"";position:absolute;left:9px;top:38px;bottom:-22px;width:1px;background:var(--line)}
.vx-tl time{font-size:.75rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--lime)}
.vx-tl li b{font-size:1.05rem}.vx-tl li span{color:var(--ash);font-size:.92rem}
.vx-tl[open] li{animation:vxIn .35s both}.vx-tl[open] li:nth-child(2){animation-delay:.04s}.vx-tl[open] li:nth-child(3){animation-delay:.08s}.vx-tl[open] li:nth-child(4){animation-delay:.12s}.vx-tl[open] li:nth-child(5){animation-delay:.16s}.vx-tl[open] li:nth-child(6){animation-delay:.2s}.vx-tl[open] li:nth-child(7){animation-delay:.24s}

.vx-toggle{display:inline-flex;padding:4px;border-radius:999px;background:#1d1d20;border:1px solid var(--line)}

 .ka{width:100%;inset:0}
 .ka-pvtoggle{display:inline-block}
 .ka.pv{inset:0 0 auto 0;height:auto}.ka.pv .ka-cols,.ka.pv .ka-foot{display:none}
 .ka-cols{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
 .ka-side{border-right:0;border-bottom:1px solid #2a2a2e;max-height:30vh}
 .ka-pv-note{left:16px;top:120px}
}

html.ka-on .reveal,html.ka-on .rise-in,html.ka-on .slide-in,html.ka-on .slide-in-r,html.ka-on .pop-in{animation:none!important;opacity:1!important;transform:none!important;translate:none!important;scale:none!important}
html.ka-on .tape-front,html.ka-on .tape-back{animation:none!important}
.vx-solo-h{margin:0!important;font-size:1.05rem!important;font-weight:800!important;letter-spacing:-.01em!important;max-width:none!important;line-height:1.2!important;color:#fff}
.ka-stats{text-decoration:none;white-space:nowrap}
.summary-col>p:last-child,.summary-col>ul:last-child{margin-bottom:32px}
/* interactive screens: arrows + counter (phones) */
.vx-nav{display:none;align-items:center;gap:8px;margin-left:auto}
.vx-arr{font:inherit;font-size:1.2rem;font-weight:800;line-height:1;width:36px;height:36px;border-radius:50%;border:1px solid #3a3a40;background:#1d1d20;color:#fff;cursor:pointer;display:grid;place-items:center;transition:background .2s,opacity .2s}
.vx-arr:not(:disabled):hover,.vx-arr:not(:disabled):active{background:var(--lime);color:#000;border-color:var(--lime)}
.vx-arr:disabled{opacity:.3;cursor:default}
.vx-count{font-size:.8rem;font-weight:700;color:var(--ash);min-width:3.2em;text-align:center}
@media (max-width:760px){
 .vx-nav{display:flex}
 .vx-top{flex-wrap:wrap}
 .vx-hint{order:3;flex-basis:100%}
 .vx-tiles{height:auto;overflow-x:auto;scroll-snap-type:none;padding-bottom:6px;scrollbar-width:none;gap:10px}
 .vx-tile{flex:0 0 34%!important;height:440px;scroll-snap-align:none;transition:flex-basis .45s cubic-bezier(.3,.9,.3,1),border-color .25s,box-shadow .25s}
 .vx-tile.is-on{flex:0 0 80%!important}
 .vx-tile .vx-ico{opacity:1}
 .vx-tile.is-on .vx-ico{opacity:0}
 .vx-demo[data-mode=a] .vx-tile .vx-a,.vx-demo[data-mode=b] .vx-tile .vx-b{opacity:0;transform:scale(.96);pointer-events:none}
 .vx-demo[data-mode=a] .vx-tile.is-on .vx-a,.vx-demo[data-mode=b] .vx-tile.is-on .vx-b{opacity:1;transform:none;pointer-events:auto}
 .vx-tile:not(.is-on) .vx-name{display:none}
}
/* next project: themed card */
.next.next-tone{position:relative;overflow:hidden;border-top:0;border-radius:var(--radius);padding:clamp(22px,3vw,36px) clamp(20px,3vw,40px) clamp(26px,3.4vw,44px);background:linear-gradient(115deg,rgba(0,0,0,.05) 0%,rgba(0,0,0,.25) 55%,rgba(0,0,0,.6) 100%),var(--nb);transition:transform .26s cubic-bezier(.3,1.4,.5,1),box-shadow .26s}
.next.next-tone .next-label{color:inherit;opacity:.85;display:flex;align-items:center;gap:8px}
.next.next-tone .next-label i{font-style:normal;transition:transform .25s}
.next.next-tone:hover{transform:translateY(-3px);box-shadow:0 16px 40px #0007}
.next.next-tone:hover .next-name{color:inherit}
.next.next-tone:hover .next-label i{transform:translateX(6px)}
/* home: each project card on its own grey panel (phones) */
@media (max-width:680px){
 .grid>.card{background:#151518;border:1px solid #26262b;border-radius:calc(var(--radius) + 6px);padding:10px 10px 20px}
 .grid>.card .thumb{margin-bottom:14px}
 .grid>.card .card-title,.grid>.card .card-summary,.grid>.card .card-when{padding-inline:8px}
 .grid>.card-wide{background:none;border:0;padding:0}
 .grid>.card-wide .card-title,.grid>.card-wide .card-summary{padding-inline:0}
}

host"}, {"label": "See my Behance", "url": "https://www.behance.net/karthikgoutham1", "style": "ghost"}]}, "about": {"title": "About me", "label": "The short version", "lead": "I'm Karthik SG, a product designer in Bengaluru who designs with the business in mind. Before I open Figma, I want to understand who's buying, what the business needs to win, and how the product will grow.", "paras": ["That instinct comes from where I started: selling property at Square Yards taught me how people really decide to buy. Since then, every project I've taken on has had a business problem at its core: giving ValueSpace.homes, a startup with zero online presence, a complete listing site buyers could trust; designing FreshLink's farm-to-fork business ecosystem before a single screen; and helping a roadside café near Chikkamagaluru get found on Google with no ad budget.", "I use AI tools throughout my process, and I'm studying for a BBA to keep sharpening the business side of what I design."], "offTitle": "Off the clock", "offSub": "When I'm not designing, I'm usually taking something apart.", "off": [{"sticker": "Weekend mechanic", "title": "Bikes & cars", "text": "I'm a motorcycle and car enthusiast. Most weekends you'll find me fixing my own bike or car.", "art": "\u003csvg aria-hidden=\"true\" viewbox=\"0 0 240 150\">\u003cg fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"5\">\u003ccircle cx=\"50\" cy=\"106\" r=\"32\" stroke-width=\"9\">\u003c/circle>\u003ccircle cx=\"50\" cy=\"106\" fill=\"currentColor\" r=\"7\">\u003c/circle>\u003ccircle cx=\"190\" cy=\"106\" r=\"32\" stroke-width=\"9\">\u003c/circle>\u003ccircle cx=\"190\" cy=\"106\" fill=\"currentColor\" r=\"7\">\u003c/circle>\u003crect fill=\"var(--pop, var(--lime))\" height=\"34\" rx=\"6\" width=\"42\" x=\"96\" y=\"78\">\u003c/rect>\u003cpath d=\"M104 88 L130 88 M104 98 L130 98\" stroke-width=\"3\">\u003c/path>\u003cpath d=\"M50 106 L96 96 M138 80 L162 56 M96 78 L84 58  I keep up with what's launching next: new phones, gadgets and cars.", "art": "\u003csvg aria-hidden=\"true\" viewbox=\"0 0 240 150\">\u003cg fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"5\">\u003crect height=\"132\" rx=\"14\" width=\"84\" x=\"78\" y=\"10\">\u003c/rect>\u003cpath d=\"M108 22 L132 22\" stroke-width=\"4\">\u003c/path>\u003crect fill=\"var(--pop, var(--lime))\" height=\"30\" rx=\"4\" width=\"56\" x=\"92\" y=\"36\">\u003c/rect>\u003cpath d=\"M92 80 L148 80 M92 94 L138 94 M92 108 L148 108 M92 122 L126 122\" stroke-width=\"4\">\u003c/path>\u003cpath d=\"M44 56 a30 30 0 0 1 0 40\">\u003c/path>\u003cpath d=\"M28 44 a46 46 0 0 1 0 64\">\u003c/path>\u003cpath d=\"M196 56 a30 30 0 0 0 0 40\">\u003c/path>\u003cpath d=\"M212 44 a46 46 0 0 0 0 64\">\u003c/path>\u003c/g>\u003c/svg>"}], "pathTitle": "How I got here", "path": [{"when": "2023", "what": "Relationship Manager", "where": "Square Yards"}, {"when": "2024", "what": "Taught myself graphic design", "where": "Branding for Nisarga Cafe"}, {"when": "Jun 2025", "what": "UI/UX bootcamp", "where": "DesignBoat UI/UX School"}, {"when": "Jul 2025", "what": "Started a BBA", "where": "Manipal University Jaipur, online"}, {"when": "Nov 2025", "what": "Product Development Intern", "where": "ValueSpace.homes"}, {"when": "May 2026", "what": "Product Designer & Digital Marketing", "where": "ValueSpace.homes"}, {"when": "2026", "what": "AI-assisted design mentorship", "where": "LaunchED Global"}, {"when": "Now", "what": "Growing as a product designer", "where": "Exploring what's next"}], "toolsLabel": "Tools I use", "tools": ["Figma", "FigJam", "Adobe Creative Suite", "Canva", "Notion", "UXPressia", "Claude", "ChatGPT", "Google Ads", "Meta Ads"]}, "projects": [{"slug": "valuespace", "show": true, "name": "ValueSpace.homes", "tone": {"bg": "#5b3e9e", "fg": "#ffffff", "mark": "#ffffff"}, "chips": ["Product design", "Web", "End-to-end delivery"], "watermark": "Real-world project", "glimpseTitle": "What I did", "glimpse": ["Full property listing site", "Trust-first design", "Design system", "Team & delivery", "Digital marketing: Google & Meta Ads"], "summary": "An end-to-end property listing site for a new Bengaluru real estate company — designed and delivered in six months, with a team I helped build.", "when": "Nov 2025 – Sep 2026", "cover": "", "case": {"heroChips": ["Product design", "Web", "End-to-end delivery"], "label": "01 — Shipped in 6 months", "statement": "Designing and delivering a complete real estate listing site, end to end, in six months.", "stats": [{"n": "6", "t": "months from first sketch to a tested, delivered site"}, {"n": "114", "t": "leads from one Google Ads campaign, out of 1.49K clicks"}], "chip": {"url": "", "b": "Behance", "rest": "Full UI/UX case study & branding"}, "timelineTitle": "View project timeline (Nov 2025 – Sep 2026)", "timeline": [{"d": "Nov 2025", "h": "Joined ValueSpace and built the team", "s": "Came in as a UX/UI design intern and helped put together two designers and three developers."}, {"d": "Dec 2025", "h": "Research and design kick off", "s": "Buyer research, information architecture and the brand identity."}, {"d": "Jan 2026", "h": "Team shake-up, first site and ad campaign live", "s": "A teammate's contract ended and two developers left. We still launched a first version of the site and ran our first Google Ads campaign."}, {"d": "Feb 2026", "h": "New developers, fresh start", "s": "Recruited two new developers and started again: designed the complete site, and development took about a month."}, {"d": "Mar 2026", "h": "Google Sheets instead of an admin dashboard", "s": "Swapped the planned admin dashboard for a Google Sheets back end so the team could ship on time."}, {"d": "May 2026", "h": "Tested and delivered", "s": "Tested the site end to end and handed over the finished product. Took on Product Designer & Digital Marketing Specialist."}, {"d": "Sep 2026", "h": "Wrapped up", " "bad\">Call for price\u003c/em>\u003c/div>\u003c/div>\u003cdiv class=\"vx-ad\">SPONSORED · Best deal, call now\u003c/div>", "classA": "", "classB": "", "attrA": ""}, {"id": "map", "ico": "🗺️", "name": "Map search", "nameB": "", "tint": "linear-gradient(170deg,#18302a,#121514)", "capA": "\u003cb>Map search.\u003c/b> Every project sits on the map with its price and what it is close to. Tap a pin.", "capB": "\u003cb>On listing portals,\u003c/b> the exact location is often held back until an agent calls you.", "htmlA": "\u003ci class=\"vx-road r1\">\u003c/i>\u003ci class=\"vx-road r2\">\u003c/i>\u003ci class=\"vx-lake\">\u003c/i>\n\u003cbutton class=\"vx-pin\" data-n=\"2 BHK · Whitefield\" data-p=\"₹78 L · 12 min to ITPL\" style=\"left:22%;top:30%\" type=\"button\">₹78L\u003c/button>\n\u003cbutton class=\"vx-pin\" data-n=\"3 BHK · Sarjapur Rd\" data-p=\"₹1.2 Cr · near Wipro\" style=\"left:58%;top:52%\" type=\"button\">₹1.2Cr\u003c/button>\n\u003cbutton class=\"vx-pin\" data-n=\"Plot · Devanahalli\" data-p=\"₹65 L · 15 min to airport\" style=\"left:34%;top:72%\" type=\"button\">₹65L\u003c/button>\n\u003cdiv class=\"vx-pop\">\u003cb>Tap a pin\u003c/b>\u003csmall>See price and distance on the map\u003c/small>\u003c/div>", "htmlB": "\u003ci class=\"vx-road r1\">\u003c/i>\u003ci class=\"vx-road r2\">\u003c/i>\u003cdiv class=\"vx-lock\">📍 Exact location shared\u003cbr/>after an agent calls you\u003c/div>", "classA": "vx-map", "classB": "vx-map grey", "attrA": ""}, {"id": "chat", "ico": "💬", "name": "WhatsApp, no login", "nameB": "Login, no WhatsApp", "tint": "linear-gradient(170deg,#33261a,#151312)", "capA": "\u003cb>WhatsApp, no login.\u003c/b> Buyers message the team straight from the site. No account, no OTP, no form.", "capB": "\u003cb>On listing portals,\u003c/b> you log in with an OTP before you can contact the seller, and your lead can be passed on to other brokers.", "htmlA": "\u003cdiv class=\"vx-wah\">\u003ci>VS\u003c/i>\u003cdiv>\u003cb>ValueSpace.homes\u003c/b>\u003csmall>usually replies in minutes\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"vx-wab\">\u003cp class=\"in\">Hi! Which project are you looking at? 👋\u003c/p>\u003c/div>\u003cdiv class=\"vx-qr\">\u003cbutton data-r=\"Yes, it is available. Want the price list and a visit slot?\" type=\"button\">Is the Whitefield 2 BHK available?\u003c/button>\u003cbutton data-r=\"Sharing it now 📄 No login needed.\" type=\"button\">Send me the price list\u003c/button>\u003cbutton data-r=\"Sure! Saturday 11 am or Sunday 4 pm?\" type=\"button\">Can I visit this weekend?\u003c/button>\u003c/div>\u003csmall class=\"vx-ok\">No login, no form. Just WhatsApp.\u003c/small>", "htmlB": "\u003cb>Log in to contact the seller\u003c/b>\u003cdiv class=\"vx-field\">Mobile number*\u003c/div>\u003cdiv class=\"vx-field\">Enter OTP*\u003c/div>\u003cspan class=\"vx-btn off\">Create account\u003c/span>\u003csmall class=\"bad\">Once you log in, your number can go to other brokers too\u003c/small>", "classA": "vx-wa", "classB": "vx-center", "attrA": ""}, {"id": "book", "ico": "📅", "name": "Book a visit", "nameB": "", "tint": "linear-gradient(170deg,#1c2640,#121318)", "capA": "\u003cb>Book a visit.\u003c/b> Buyers choose a site visit or an online meeting, at a day and time that suits them.", "capB": "\u003cb>On listing portals,\u003c/b> you request a callback and then the calls never stop.", "htmlA": "\u003cp class=\"vx-h\">Book at your time\u003c/p>\u003cdiv class=\"vx-filters vx-kind\">\u003cbutton class=\"on\" type=\"button\">Site visit\u003c/button>\u003cbutton type=\"button\">Online meet\u003c/button>\u003c/div>\n\u003cdiv class=\"vx-days\">\u003cbutton class=\"on\" type=\"button\">Sat\u003cb>8\u003c/b>\u003c/button>\u003cbutton type=\"button\">Sun\u003cb>9\u003c/b>\u003c/button>\u003cbutton type=\"button\">Mon\u003cb>10\u003c/b>\u003c/button>\u003c/div>\n\u003cdiv class=\"vx-slots\">\u003cbutton type=\"button\">10 am\u003c/button>\u003cbutton type=\"button\">12 pm\u003c/button>\u003cbutton type=\"button\">4 pm\u003c/button>\u003cbutton type=\"button\">6 pm\u003c/button>\u003c/div>\u003cp class=\"vx-conf\">Pick a slot\u003c/p>", "htmlB": "\u003cp class=\"vx-h\">Request a callback\u003c/p>\u003cdiv class=\"vx-toast\">📞 Unknown number · 9:12 am\u003c/div>\u003cdiv class=\"vx-toast\">📞 Unknown number · 9:40 am\u003c/div>\u003cdiv class=\"vx-toast\">📞 Unknown number · 11:05 am\u003c/div>\u003csmall class=\"bad\">An agent will call you. Then another.\u003c/small>", "classA": "", "classB": "", "attrA": "data-book"}], "compare": true, "title": ""}, "summaryTitle": "Project summary", "sections": [{"col": 1, "h": "Context", "text": "ValueSpace.homes is a new real estate consultancy in Bengaluru with zero online presence. I helped the startup build one, and with it, the trust of the buyers it works with."}, {"col": 1, "h": "Problem", "text": "Property buyers are wary online. Listing platforms sell their phone numbers, so they expect spam and distrust unknown callers. The site had to do more than list properties; it had to make a brand-new company feel trustworthy from the first visit."}, {"col": 1, "h": "Solution", "text": "A complete property listing site built around one promise: we respect the buyer's time. Buyers browse projects and explore them on a map, see the details that matter before anyone calls, download brochures, and book site visits or online meetings at a time that suits them."}, {"col": 2, "h": "What I did", "list": ["Designed the whole site end to end with my co-designer: information architecture, property listings and project pages, map-based search, booking flows and responsive layouts.", "Created the brand identity and a lightweight design system so a small team could build quickly and consistently.", "Helped build the team — two designers and three developers — and ran the project: tasks, timelines and scope.", "Worked around real constraints: a team that kept changing and a scope that had to flex. We swapped a planned admin dashboard for a Google Sheets back end to ship on time.", "After launch, designed the landing pages and ran the Google Ads campaigns that brought buyers to the site."]}, {"col": 2, "h": "Outcome", "list": ["We designed and delivered a complete real estate site in six months, from first sketch to launch.", "Started as a UX/UI design intern and ended up leading design and delivery.", "Once the site was live, one ad campaign brought in 114 leads from 1.49K clicks."]}], "facts": [{"dt": "Role", "dd": "Product Designer — joined as a UX/UI design intern, then led design and delivery"}, {"dt": "Team", "dd": "2 designers, 3 developers (2 front-end, 1 back-end), founders as stakeholders"}, {"dt": "Timeline", "dd": "Nov 2025 – Sep 2026"}], "cta": {"show": true, "h": "Want the full story?", "label": "Read the full case study on Behance", "url": "https://www.behance.net/gallery/257555797/ValueSpacehomes-UIUX-Case-Study-Branding", "more": []}}}, {"slug": "freshlink", "show": true, "name": "FreshLink", "tone": {"bg": "#1f5e3b", "fg": "#ffffff", "mark": "#ffffff"}, "chips": ["UX research", "Marketplace", "AI workflow"], "watermark": "Mentorship project", "glimpseTitle": "What I did", "glimpse": ["Business ecosystem", "Trust-first research", "Consumer app", "Kannada-first farmer portal", "Ops dashboard"], "summary": "A farm-to-consumer produce business for Bengaluru: the business ecosystem behind it, plus a consumer app, a Kannada-first farmer portal and an ops dashboard.", "when": "Jun – Aug 2026", "cover": "", "case": {"heroChips": ["UX research", "Marketplace", "AI workflow"], "label": "02 — Concept to prototype in 3 months", "statement": "Fresh produce you can trace back to the farmer who grew it. I designed the business behind it, not just the screens.", "stats": [{"n": "6", "t": "stages in the business, from farm to fork"}, {"n": "3", "t": "connected products: consumer app, farmer app, ops dashboard"}], "chip": {"url": "", "b": "Behance", "rest": "Full UX case study"}, "timelineTitle": "View project timeline (Jun – Aug 2026)", "timeline": [{"d": "Discover", "h": "Brief, market and simulated interviews", "s": "Took on the internship brief; Claude and ChatGPT simulated stakeholder and customer interviews, all labelled as AI-generated."}, {"d": "Define", "h": "Trust is the real problem", "s": "Two personas in UXPressia, a Bengaluru buyer and a farmer near Chikkaballapura, with journey maps of where trust is won or lost."}, {"d": "Develop", "h": "Designed the business before the screens", "s": "Six stages from farm to fork, a hybrid procurement model with prices locked before pickup, and a grading hub as the quality gate."}, {"d": "Deliver", "h": "Three products, one brand", "s": "Brand and design system, the consumer app, a Kannada farmer app with a listen button on every screen, and an ops dashboard."}, {"d": "Next", "h": "Next: real users", "s": "Usability tests with real buyers, farmers and ops staff, and a native-speaker review of the Kannada copy."}], "demo": {"show": true, "acc": "#1f5e3b", "a": "FreshLink ✨", "b": "Mandi supply chain 😬", "hint": "Tap a screen to try it", "tiles": [{"id": "trace", "ico": "🌾", "name": "Trace your harvest", "nameB": "", "tint": "linear-gradient(170deg,#1a3326,#111513)", "capA": "\u003cb>Trace your harvest.\u003c/b> Health-conscious buyers see the harvest date, the farm and the grade, and can follow the batch straight from the farm to their door.", "capB": "\u003cb>In the mandi chain,\u003c/b> produce passes from farmer to middleman to mandi to retailer. By the time it reaches you, nobody can say where it was grown or when.", "classA": "", "classB": "", "attrA": "", "htmlA": "\u003cp class=\"vx-h\">Tomatoes · 1 kg\u003c/p>\u003cdiv class=\"vx-box\">\u003cb>Harvested yesterday\u003c/b>\u003csmall>Farm near Chikkaballapura · Grade A\u003c/small>\u003c/div>\u003cul class=\"vx-steps\">\u003cli>\u003ci>🌾\u003c/i>Picked at the farm\u003c/li>\u003cli>\u003ci>⚖️\u003c/i>Graded and tested at the hub\u003c/li>\u003cli>\u003ci>🚚\u003c/i>Out for delivery\u003c/li>\u003cli>\u003ci>🏠\u003c/i>At your door\u003c/li>\u003c/ul>\u003cbutton type=\"button\" class=\"vx-tap\" data-done=\"✓ Traced to the farm\">Trace this batch\u003c/button>", "htmlB": "\u003cp class=\"vx-h\">Tomatoes · 1 kg\u003c/p>\u003cul class=\"vx-steps\" style=\"opacity:1\">\u003cli style=\"opacity:1;transform:none\">\u003ci>🧑‍🌾\u003c/i>Farmer\u003c/li>\u003cli style=\"opacity:1;transform:none\">\u003ci>🤝\u003c/i>Middleman\u003c/li>\u003cli style=\"opacity:1;transform:none\">\u003ci>🏪\u003c/i>Mandi\u003c/li>\u003cli style=\"opacity:1;transform:none\">\u003ci>🛒\u003c/i>Retailer or app\u003c/li>\u003c/ul>\u003cdiv class=\"vx-box\">\u003cb>Origin: unknown\u003c/b>\u003csmall class=\"bad\">Harvest date: unknown · days in transit\u003c/small>\u003c/div>"}, {"id": "tested", "ico": "🧪", "name": "Tested for residue", "nameB": "", "tint": "linear-gradient(170deg,#1c2640,#121318)", "capA": "\u003cb>Tested for residue.\u003c/b> Every batch is checked for pesticides and herbicides, and buyers can see the result before they order.", "capB": "\u003cb>In the mandi chain,\u003c/b> there is no test result to see. Buyers just have to trust the label.", "classA": "", "classB": "vx-center", "attrA": "", "htmlA": "\u003cp class=\"vx-h\">Batch #214 · Test results\u003c/p>\u003cdiv class=\"vx-row\">\u003cb>Pesticide residue\u003c/b>\u003cspan class=\"vx-pill\">✓ Passed\u003c/span>\u003c/div>\u003cdiv class=\"vx-row\">\u003cb>Herbicide residue\u003c/b>\u003cspan class=\"vx-pill\">✓ Passed\u003c/span>\u003c/div>\u003cdiv class=\"vx-row\">\u003cb>Freshness check\u003c/b>\u003cspan class=\"vx-pill\">✓ Passed\u003c/span>\u003c/div>\u003cbutton type=\"button\" class=\"vx-tap\" data-busy=\"Opening report…\" data-done=\"✓ Report opened\">View test report\u003c/button>", "htmlB": "\u003cb>Test results\u003c/b>\u003cdiv class=\"vx-blank\">No test results.\u003cbr>“Fresh” and “safe” are just labels.\u003c/div>"}, {"id": "farmer", "ico": "🧑‍🌾", "name": "Farmers sell direct", "nameB": "Farmers sell via middlemen", "tint": "linear-gradient(170deg,#33261a,#151312)", "capA": "\u003cb>Farmers sell direct.\u003c/b> A farmer app in Kannada, with a listen button on every screen and no typing, lets farmers sell their harvest to FreshLink at a price locked before pickup.", "capB": "\u003cb>In the mandi chain,\u003c/b> farmers have no app of their own. They sell through middlemen, the price is set on the day, and they wait to be paid.", "htmlA": "\u003cp class=\"vx-h vx-kn\">ನಿಮ್ಮ ಬೆಳೆ · Your harvest\u003c/p>\u003cdiv class=\"vx-box\">\u003csmall>Sell to FreshLink · price locked before pickup\u003c/small>\u003cspan class=\"vx-big\">₹28 / kg\u003c/span>\u003cspan class=\"vx-pill\">ಬೆಲೆ ಖಚಿತ · Locked\u003c/span>\u003c/div>\u003cdiv class=\"vx-say\">\u003cbutton type=\"button\" class=\"vx-tap\" data-done=\"🔊 Playing in Kannada…\">🔊 Listen\u003c/button>\u003csmall>No typing needed\u003c/small>\u003c/div>", "htmlB": "\u003cp class=\"vx-h\">Selling at the mandi\u003c/p>\u003cdiv class=\"vx-box\">\u003cb>Price: decided on the day\u003c/b>\u003csmall>Set by the middleman, after the produce has left the farm\u003c/small>\u003c/div>\u003cdiv class=\"vx-blank\">No farmer app.\u003cbr>When will I be paid?\u003c/div>", "classA": "", "classB": "", "attrA": ""}, {"id": "hub", "ico": "⚖️", "name": "Grading hub", "nameB": "", "tint": "linear-gradient(170deg,#1c2640,#121318)", "capA": "\u003cb>Grading hub.\u003c/b> Every batch is graded at FreshLink’s hub, the quality gate, and the grade is recorded for both the farmer and the buyer.", "capB": "\u003cb>In the mandi chain,\u003c/b> weight and grade come down to the middleman’s word, so farmers worry about being cheated.", "htmlA": "\u003cp class=\"vx-h\">Batch #214 · Tomatoes\u003c/p>\u003cdiv class=\"vx-seg\">\u003cbutton class=\"on\" data-p=\"ga\" type=\"button\">Grade A\u003c/button>\u003cbutton data-p=\"gb\" type=\"button\">Grade B\u003c/button>\u003cbutton data-p=\"gc\" type=\"button\">Reject\u003c/button>\u003c/div>\u003cdiv class=\"vx-box on\" data-pane=\"ga\">\u003cb>Grade A · 120 kg\u003c/b>\u003csmall>Recorded and shared with the farmer and the buyer\u003c/small>\u003c/div>\u003cdiv class=\"vx-box\" data-pane=\"gb\">\u003cb>Grade B · 120 kg\u003c/b>\u003csmall>Recorded and shared with the farmer and the buyer\u003c/small>\u003c/div>\u003cdiv class=\"vx-box\" data-pane=\"gc\">\u003cb>Rejected\u003c/b>\u003csmall>Reason recorded and shown to the farmer\u003c/small>\u003c/div>", "htmlB": "\u003cp class=\"vx-h\">Batch received\u003c/p>\u003cdiv class=\"vx-box\">\u003cb>Weight: as per the middleman\u003c/b>\u003csmall class=\"bad\">Grade decided by eye, no record\u003c/small>\u003c/div>\u003cdiv class=\"vx-blank\">Farmer finds out later.\u003cbr/>Or never.\u003c/div>", "classA": "", "classB": "", "attrA": ""}], "compare": true, "title": ""}, "summaryTitle": "Project summary", "sections": [{"col": 1, "h": "Context", "text": "FreshLink is a fresh produce marketplace for Bengaluru that lets buyers trace every item back to the farm. It started as an internship brief, and I took it through to completion using AI at every stage."}, {"col": 1, "h": "Problem", "text": "Research showed that trust, not access, is the real problem on both sides. Buyers can't tell how fresh produce is or who grew it. Farmers worry about when they'll be paid, whether the price will change, and whether they'll be cheated on weight or grade, and many find apps hard to use."}, {"col": 1, "h": "Solution", "text": "I reframed the brief from \"another grocery app\" to a transparent fresh produce business, and designed that business before the screens. Farmers sell to FreshLink at a locked price, a hub grades every batch, and buyers see the harvest date, farm and grade before they buy."}, {"col": 2, "h": "What I did", "list": ["Followed the Double Diamond with AI doing the heavy lifting: Claude and ChatGPT simulated stakeholder and customer interviews, all labelled as AI-generated. I set the questions and made the calls.", "Checked every market number against its source, and made the AI argue against its own insights before I accepted them.", "Built two personas in UXPressia, a Bengaluru buyer and a farmer near Chikkaballapura, with journey maps showing where trust is won or lost.", "Designed the business ecosystem before any screens: who does what at each of the six stages from farm to fork, and the value each stage creates for farmers, FreshLink and buyers.", "Made the key business decisions, such as a hybrid procurement model with prices locked before pickup and a grading hub as the quality gate.", "Created the brand and design system.", "Designed the consumer app, a farmer portal in Kannada with a listen button on every screen and no typing, and an operations dashboard."]}, {"col": 2, "h": "Outcome", "list": ["Next: usability tests with real buyers, farmers and ops staff, and a native-speaker review of the Kannada copy.", "Biggest lesson: AI agrees too easily. Simulated interviews are hypotheses, not evidence — real users come next."]}], "facts": [{"dt": "Role", "dd": "UX/UI designer — research, strategy, UX, UI and prototype. Internship project with a LaunchED Global mentor"}, {"dt": "Timeline", "dd": "Jun – Aug 2026"}], "cta": {"show": true, "h": "Want the full story?", "label": "Read the full case study on Behance", "url": "https://www.behance.net/gallery/257789367/FreshLink-Farm-to-Consumer-Traceability-App-UX", "more": [{"label": "Consumer app (iOS)", "url": "https://www.behance.net/gallery/257792933/FreshLink-Farm-to-Consumer-Produce-App-iOS-App"}, {"label": "Farmer app", "url": "https://www.behance.net/gallery/257793925/FreshLink-a-app-for-farmers-to-sell-their-harvest"}, {"label": "App and ops dashboard", "url": "https://www.behance.net/gallery/257795379/FreshLink-AI-Led-Farm-to-Door-App-Dashboard"}]}}}, {"slug": "fitverse", "show": true, "name": "Fitverse", "tone": {"bg": "linear-gradient(160deg,#e8743b 0%,#b84a1c 55%,#5e2610 100%)", "fg": "#ffffff", "mark": "#ffffff"}, "chips": ["UX research", "Mobile app", "Gamification"], "watermark": "Bootcamp project", "glimpseTitle": "What I did", "glimpse": ["Teen user research", "Mood-based workouts", "Badges, streaks & challenges", "iOS & Android"], "summary": "A gamified fitness app for teens, with mood-based workouts, challenges and rewards. Designed for iOS and Android in 14 weeks.", "when": "2025, 14 weeks", "cover": "", "case": {"heroChips": ["UX research", "Mobile app", "Gamification"], "label": "03 — Research to prototype in 14 weeks", "statement": "A fitness app that helps teenagers build healthy habits by making staying active feel like a game, not a chore.", "stats": [{"n": "14", "t": "weeks from research to tested prototype"}, {"n": "2", "t": "platforms designed: iOS and Android"}], "chip": {"url": "", "b": "Behance", "rest": "Full UX case study"}, "timelineTitle": "View project timeline (2025, 14 weeks)", "timeline": [{"d": "Discover", "h": "Strategy and research with teens", "s": "Design strategy, competitive analysis and user research with teenagers."}, {"d": "Define", "h": "Who we are designing for", "s": "Problem statement, persona and empathy map."}, {"d": "Ideate", "h": "How it flows", "s": "User journey map, user flows and information architecture."}, {"d": "Design", "h": "iOS and Android", "s": "Lo-fi and hi-fi wireframes, visual design and interactive prototypes, following each platform’s guidelines."}, {"d": "Test", "h": "Usability tested along the way", "s": "Complete iOS and Android designs with interactive prototypes, tested as we went."}], "demo": {"show": true, "acc": "#c2552c", "a": "Fitverse ✨", "b": "Other apps", "hint": "Tap a screen to try it", "tiles": [{"id": "mood", "ico": "😊", "name": "Mood workouts", "nameB": "", "tint": "linear-gradient(170deg,#33261a,#151312)", "capA": "\u003cb>Mood workouts.\u003c/b> Teens pick how they feel and get a short, equipment-free routine to match, so getting active never feels like a chore.", "capB": "\u003cb>Adult fitness apps\u003c/b> hand out long gym sessions that ignore how a teen actually feels that day.", "htmlA": "\u003cp class=\"vx-h\">How are you feeling?\u003c/p>\u003cdiv class=\"vx-seg\">\u003cbutton class=\"on\" data-p=\"m1\" type=\"button\">😴 Tired\u003c/button>\u003cbutton data-p=\"m2\" type=\"button\">⚡ Hyped\u003c/button>\u003cbutton data-p=\"m3\" type=\"button\">😤 Stressed\u003c/button>\u003c/div>\u003cdiv class=\"vx-box on\" data-pane=\"m1\">\u003cb>Wake-up stretch\u003c/b>\u003csmall>8 min · no equipment\u003c/small>\u003c/div>\u003cdiv class=\"vx-box\" data-pane=\"m2\">\u003cb>Jump-rope blast\u003c/b>\u003csmall>12 min · no equipment\u003c/small>\u003c/div>\u003cdiv class=\"vx-box\" data-pane=\"m3\">\u003cb>Shake-it-off flow\u003c/b>\u003csmall>10 min · no equipment\u003c/small>\u003c/div>\u003cbutton class=\"vx-tap\" data-done=\"✓ Let’s go!\" type=\"button\">Start\u003c/button>", "htmlB": "\u003cp class=\"vx-h\">Today: Leg day\u003c/p>\u003cdiv class=\"vx-box\">\u003cb>60 min · Gym\u003c/b>\u003csmall>Barbell, bench, leg press\u003c/small>\u003c/div>\u003cdiv class=\"vx-blank\">Same plan whether you’re\u003cbr/>tired, hyped or stressed\u003c/div>", "classA": "", "classB": "", "attrA": ""}, {"id": "streak", "ico": "🔥", "name": "Streaks & badges", "nameB": "", "tint": "linear-gradient(170deg,#1a3326,#111513)", "capA": "\u003cb>Streaks & badges.\u003c/b> Tap “Done today” to grow the streak and unlock badges, small wins that build a habit.", "capB": "\u003cb>Adult fitness apps\u003c/b> offer a 90-day plan and little reason to open the app tomorrow.", "htmlA": "\u003cp class=\"vx-h\">Your streak\u003c/p>\u003cdiv class=\"vx-box\">\u003cspan class=\"vx-big\">\u003cspan class=\"vx-num\">3\u003c/span> 🔥\u003c/span>\u003csmall>days in a row\u003c/small>\u003cdiv class=\"vx-bar\">\u003ci>\u003c/i>\u003c/div>\u003c/div>\u003cdiv class=\"vx-badges\">\u003cspan class=\"vx-badge got\" data-at=\"1\">🥉\u003c/span>\u003cspan class=\"vx-badge got\" data-at=\"3\">🥈\u003c/span>\u003cspan class=\"vx-badge\" data-at=\"5\">🥇\u003c/span>\u003cspan class=\"vx-badge\" data-at=\"7\">🏆\u003c/span>\u003c/div>\u003cbutton class=\"vx-tap vx-inc\" data-max=\"7\" type=\"button\">✓ Done today\u003c/button>", "htmlB": "\u003cp class=\"vx-h\">Progress\u003c/p>\u003cdiv class=\"vx-box\">\u003cb>Day 1 of 90\u003c/b>\u003csmall>No rewards until you finish\u003c/small>\u003c/div>\u003cdiv class=\"vx-blank\">Nothing to come back for\u003c/div>", "classA": "", "classB": "", "attrA": ""}, {"id": "friends", "ico": "🏆", "name": "Group challenges", "nameB": "", "tint": "linear-gradient(170deg,#1c2640,#121318)", "capA": "\u003cb>Group challenges.\u003c/b> Leaderboards and squad challenges bring friends in, so staying active feels social.", "capB": "\u003cb>Adult fitness apps\u003c/b> are built for working out alone.", "htmlA": "\u003cp class=\"vx-h\">Weekend squad challenge\u003c/p>\u003cdiv class=\"vx-row\">\u003cb>1 · Aisha\u003c/b>\u003cem>420 pts\u003c/em>\u003c/div>\u003cdiv class=\"vx-row me\">\u003cb>2 · You\u003c/b>\u003cem>380 pts\u003c/em>\u003c/div>\u003cdiv class=\"vx-row\">\u003cb>3 · Rohan\u003c/b>\u003cem>310 pts\u003c/em>\u003c/div>\u003cbutton class=\"vx-tap\" data-done=\"✓ You’re in! +50 pts\" type=\"button\">Join challenge\u003c/button>", "htmlB": "\u003cp class=\"vx-h\">Workout log\u003c/p>\u003cdiv class=\"vx-blank\">Just you and a spreadsheet\u003cbr/>of sets and reps\u003c/div>", "classA": "", "classB": "", "attrA": ""}, {"id": "sport", "ico": "⚽", "name": "Sports routines", "nameB": "", "tint": "linear-gradient(170deg,#2a2148,#141218)", "capA": "\u003cb>Sports routines.\u003c/b> Short routines inspired by the sports teens already play, sized to fit around school.", "capB": "\u003cb>Adult fitness apps\u003c/b> use fixed schedules that clash with school and sport.", "htmlA": "\u003cp class=\"vx-h\">Train for your sport\u003c/p>\u003cdiv class=\"vx-seg\">\u003cbutton class=\"on\" data-p=\"s1\" type=\"button\">⚽ Football\u003c/button>\u003cbutton data-p=\"s2\" type=\"button\">🏏 Cricket\u003c/button>\u003cbutton data-p=\"s3\" type=\"button\">🏀 Hoops\u003c/button>\u003c/div>\u003cdiv class=\"vx-box on\" data-pane=\"s1\">\u003cb>Sprint &amp; agility drills\u003c/b>\u003csmall>15 min · fits after school\u003c/small>\u003c/div>\u003cdiv class=\"vx-box\" data-pane=\"s2\">\u003cb>Shoulder &amp; core warm-up\u003c/b>\u003csmall>12 min · before nets\u003c/small>\u003c/div>\u003cdiv class=\"vx-box\" data-pane=\"s3\">\u003cb>Jump &amp; footwork\u003c/b>\u003csmall>14 min · no equipment\u003c/small>\u003c/div>", "htmlB": "\u003cp class=\"vx-h\">Generic plan\u003c/p>\u003cdiv class=\"vx-box\">\u003cb>Mon · Wed · Fri, 7 am\u003c/b>\u003csmall class=\"bad\">Clashes with school and practice\u003c/small>\u003c/div>\u003cdiv class=\"vx-blank\">Doesn’t know you play a sport\u003c/div>", "classA": "", "classB": "", "attrA": ""}], "compare": false, "title": "Try Fitverse"}, "summaryTitle": "Project summary", "sections": [{"col": 1, "h": "Context", "text": "Fitverse is a mobile app that encourages teenagers to stay active, eat better and build confidence in their fitness journey."}, {"col": 1, "h": "Problem", "text": "Most fitness apps are built for adults. For teens, workouts feel like a chore, plans don't fit around school and sport, and there's little to keep them coming back."}, {"col": 1, "h": "Solution", "text": "Short, fun, equipment-free workouts made for teens, including mood-based and sports-inspired routines. Badges, streaks and challenges keep them motivated, while leaderboards and group challenges bring friends in. Personalised plans and nutrition tips round it out, without pressure."}, {"col": 2, "h": "What I did", "list": ["Followed the Design Thinking process with human-centred design principles, from research to tested prototype.", "Discover: design strategy, competitive analysis and user research with teens.", "Define: problem statement, persona and empathy map.", "Ideate: user journey map, u window.KS_wire=function(root){
 function all(r,s){return [].slice.call(r.querySelectorAll(s))}
 all(root,'.vx-demo').forEach(function(d){
  var cap=d.querySelector('.vx-cap'), tiles=all(d,'.vx-tile');
  function on(){return d.querySelector('.vx-tile.is-on')||tiles[0]}
  function upd(){var t=on();cap.innerHTML=t.getAttribute('data-'+d.dataset.mode)||''}
  var row=d.querySelector('.vx-tiles'),cnt=d.querySelector('.vx-count');
  function centre(t){if(!row||row.scrollWidth<=row.clientWidth+2)return;setTimeout(function(){var x=t.offsetLeft-(row.clientWidth-t.offsetWidth)/2;row.scrollTo({left:Math.max(0,x),behavior:'smooth'})},260)}
  function pick(t){tiles.forEach(function(x){x.classList.toggle('is-on',x===t)});upd();var i=tiles.indexOf(t);if(cnt)cnt.textContent=(i+1)+' / '+tiles.length;all(d,'.vx-arr').forEach(function(b){b.disabled=(+b.dataset.dir<0&&i===0)||(+b.dataset.dir>0&&i===tiles.length-1)});centre(t)}
  all(d,'.vx-arr').forEach(function(b){b.addEventListener('click',function(){var i=tiles.indexOf(on())+(+b.dataset.dir);if(i>=0&&i<tiles.length)pick(tiles[i])})});
  if(cnt){cnt.textContent='1 / '+tiles.length;var a0=d.querySelector('.vx-arr[data-dir="-1"]');if(a0)a0.disabled=true}
  tiles.forEach(function(t){
   t.addEventListener('click',function(){if(!t.classList.contains('is-on')) pick(t)});
   t.addEventListener('keydown',function(e){if(e.target===t&&(e.key==='Enter'||e.key===' ')){e.preventDefault();pick(t)}});
  });
  all(d,'.vx-toggle button').forEach(function(b){b.addEventListener('click',function(){
   d.dataset.mode=b.dataset.m;all(d,'.vx-toggle button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});upd()})});
  // exclusive button groups: filters, panes, booking
  all(d,'.vx-seg,.vx-filters,.vx-days,.vx-slots').forEach(function(g){
   var scr=g.closest('.vx-scr');
   all(g,'button').forEach(function(b){b.addEventListener('click',function(){
    all(g,'button').forEach(function(x){x.classList.toggle('on',x===b)});
    if(b.dataset.f) all(scr,'[data-s]').forEach(function(c){c.classList.toggle('hide',b.dataset.f!=='all'&&c.dataset.s!==b.dataset.f)});
    if(b.dataset.p){all(scr,'[data-pane]').forEach(function(p){p.classList.toggle('on',p.dataset.pane===b.dataset.p)});
     if(b.dataset.v) scr.setAttribute('data-v',b.dataset.v)}
    if(scr.hasAttribute('data-book')) book(scr);
   })})});
  function book(scr){var c=scr.querySelector('.vx-conf'),k=scr.querySelector('.vx-kind .on'),dy=scr.querySelector('.vx-days .on'),sl=scr.querySelector('.vx-slots .on');
   if(!sl){c.textContent='Pick a slot';c.classList.remove('done');return}
   c.textContent='✓ '+k.textContent+' booked · '+dy.firstChild.textContent+' '+dy.querySelector('b').textContent+', '+sl.textContent;c.classList.add('done')}
  // map pins
  all(d,'.vx-pin').forEach(function(p){p.addEventListener('click',function(){var scr=p.closest('.vx-scr');
   all(scr,'.vx-pin').forEach(function(x){x.classList.toggle('on',x===p)});
   scr.querySelector('.vx-pop').innerHTML='<b>'+p.dataset.n+'</b><small>'+p.dataset.p+'</small>'})});
  // chat quick replies
  all(d,'.vx-qr button').forEach(function(q){q.addEventListener('click',function(){var wb=q.closest('.vx-scr').querySelector('.vx-wab');
   var o=document.createElement('p');o.className='out';o.textContent=q.textContent;wb.appendChild(o);
   var t=document.createElement('p');t.className='in typing';t.textContent='typing…';wb.appendChild(t);wb.scrollTop=wb.scrollHeight;
   setTimeout(function(){t.className='in';t.textContent=q.dataset.r;wb.scrollTop=wb.scrollHeight},800)})});
  // tap buttons that flip to a done state
  all(d,'.vx-tap:not(.vx-inc)').forEach(function(b){var t0=b.innerHTML;b.addEventListener('click',function(){
   if(b.classList.contains('done')){b.classList.remove('done');b.innerHTML=t0;b.closest('.vx-scr').classList.remove('lit');return}
   var go=function(){b.classList.add('done');b.innerHTML=b.dataset.done;b.closest('.vx-scr').classList.add('lit')};
   if(b.dataset.busy){b.innerHTML=b.dataset.busy;setTimeout(go,700)}else go()})});
  // counters (streaks)
  all(d,'.vx-inc').forEach(function(b){var scr=b.closest('.vx-scr'),n=scr.querySelector('.vx-num'),bar=scr.querySelector('.vx-bar i'),max=+(b.dataset.max||7);
   b.addEventListener('click',function(){var v=(+n.textContent+1);if(v>max)v=1;n.textContent=v;
    if(bar)bar.style.width=(v/max*100)+'%';
    all(scr,'.vx-badge').forEach(function(x){x.classList.toggle('got',v>=+x.dataset.at)})})});
  upd();
 });

/* ---------- field rendering ---------- */
var uid=0;
function field(f,obj,base){
 if(f.t==='head')return '<div class="ka-head"><b>'+E(f.l)+'</b>'+(f.h?'<small class="ka-help">'+E(f.h)+'</small>':'')+'</div>';
 var path=f.k===''?base:(base?base+'.'+f.k:f.k), v=f.k===''?get(DATA,base):get(obj,f.k), id='ka'+(uid++);
 var help=f.h?'<small class="ka-help">'+E(f.h)+'</small>':'';
 if(f.t==='head')return '<div class="ka-head"><b>'+E(f.l)+'</b>'+help+'</div>';
 var lab='<label for="'+id+'">'+E(f.l)+'</label>';
 if(f.t==='text')return '<div class="ka-f">'+lab+'<input id="'+id+'" data-p="'+E(path)+'" value="'+E(v)+'">'+help+'</div>';
 if(f.t==='area')return '<div class="ka-f">'+lab+'<textarea id="'+id+'" rows="3" data-p="'+E(path)+'">'+E(v)+'</textarea>'+help+'</div>';
 if(f.t==='html')return '<div class="ka-f">'+lab+'<textarea id="'+id+'" rows="3" class="ka-code" data-p="'+E(path)+'">'+E(v)+'</textarea>'+(help||'<small class="ka-help">Text, or simple HTML like &lt;b&gt;bold&lt;/b&gt;</small>')+'</div>';
 if(f.t==='lines')return '<div class="ka-f">'+lab+'<textarea id="'+id+'" rows="4" data-p="'+E(path)+'" data-lines="1">'+E((v||[]).join('\n'))+'</textarea>'+help+'</div>';
 if(f.t==='bool')return '<div class="ka-f ka-bool"><label><input type="checkbox" data-p="'+E(path)+'" data-bool="1"'+(v!==false?' checked':'')+'> '+E(f.l)+'</label>'+help+'</div>';
 if(f.t==='sel')return '<div class="ka-f">'+lab+'<select id="'+id+'" data-p="'+E(path)+'">'+Object.keys(f.o).map(function(k){return '<option value="'+E(k)+'"'+(String(v)===k?' selected':'')+'>'+E(f.o[k])+'</option>'}).join('')+'</select>'+help+'</div>';
 if(f.t==='color'){var hex=/^#[0-9a-f]{6}$/i.test(v||'')?v:'#000000';
  return '<div class="ka-f">'+lab+'<div class="ka-color"><input type="color" value="'+E(hex)+'" data-sync="'+id+'" aria-label="Pick colour"><input id="'+id+'" data-p="'+E(path)+'" value="'+E(v)+'"><span class="ka-sw" style="background:'+E(v)+'"></span></div>'+help+'</div>'}
 if(f.t==='img')return '<div class="ka-f">'+lab+'<div class="ka-img">'+(v?'<img src="'+E(v)+'" alt="">':'<span class="ka-noimg">No image</span>')+'<div><input type="file" accept="image/*" data-up="'+E(path)+'"'+(ASSETS?'':' disabled')+'><button type="button" class="ka-sm" data-clear="'+E(path)+'">Remove</button></div></div><input data-p="'+E(path)+'" value="'+E(v)+'" placeholder="or paste an image URL">'+(ASSETS?help:'<small class="ka-help">Uploading needs the editor view on claude.ai. You can paste an image URL instead.</small>')+'</div>';
 if(f.t==='file')return '<div class="ka-f">'+lab+'<div class="ka-img"><span class="ka-noimg">'+(v?'📄 Uploaded':'No file')+'</span><div><input type="file" accept="'+E(f.accept||'application/pdf')+'" data-up="'+E(path)+'" data-name="'+E(f.nameKey||'')+'"'+(ASSETS?'':' disabled')+'>'+(v?'<a class="ka-sm" href="'+E(v)+'" target="_blank" rel="noreferrer">Open</a> ':'')+'<button type="button" class="ka-sm" data-clear="'+E(path)+'">Remove</button></div></div>'+(ASSETS?help:'<small class="ka-help">Uploading needs the editor view on claude.ai.</small>')+'</div>';
 if(f.t==='screen'){var cp=(base?base+'.':'')+f.c, cv=get(obj,f.c)||'';
  return '<div class="ka-f ka-screen">'+lab+'<div class="ka-row"><select data-p="'+E(cp)+'">'+Object.keys(SCREEN_CLASS).map(function(k){return '<option value="'+E(k)+'"'+(cv===k?' selected':'')+'>'+E(SCREEN_CLASS[k])+'</option>'}).join('')+'</select>'+
   '<select data-snip="'+E(path)+'"><option value="">+ Insert a widget…</option>'+Object.keys(SNIP).map(function(k){return '<option>'+E(k)+'</option>'}).join('')+'</select></div>'+
   '<textarea id="'+id+'" rows="7" class="ka-code" data-p="'+E(path)+'">'+E(v)+'</textarea><small class="ka-help">HTML for this mock screen. Insert widgets above, then edit the words. The preview updates as you type.</small></div>'}
 if(f.t==='list'){var arr=v||[];
  return '<div class="ka-list"><div class="ka-list-h"><b>'+E(f.l)+'</b><span>'+arr.length+'</span></div>'+help+arr.map(function(it,i){var ip=path+'.'+i;
   var title=typeof it==='string'?String(it).replace(/<[^>]+>/g,'').slice(0,40):(it.name||it.h||it.label||it.title||it.when||it.d||it.dt||it.n||'');
   return '<details class="ka-item"'+(arr.length<=3||sel.openItem===ip?' open':'')+'><summary><span>'+E(f.item)+' '+(i+1)+(title?' · '+E(String(title).slice(0,40)):'')+'</span><span class="ka-acts"><button type="button" class="ka-ic" data-mv="'+E(path)+'|'+i+'|-1" title="Move up">↑</button><button type="button" class="ka-ic" data-mv="'+E(path)+'|'+i+'|1" title="Move down">↓</button><button type="button" class="ka-ic" data-dup="'+E(path)+'|'+i+'" title="Duplicate">⧉</button><button type="button" class="ka-ic ka-del" data-del="'+E(path)+'|'+i+'" title="Delete">✕</button></span></summary><div class="ka-item-b">'+
    f.f.map(function(sf){return field(sf,it,ip)}).join('')+'</div></details>'}).join('')+
   '<button type="button" class="ka-add" data-add="'+E(path)+'">+ Add '+E(f.item.toLowerCase())+'</button></div>'}
 return '';
}

/* ---------- panel ---------- */
function nav(){
 return '<nav class="ka-nav">'+['site','theme','home','about'].map(function(k){return '<button type="button" data-sec="'+k+'" class="'+(sel.sec===k?'on':'')+'">'+E(SECTIONS[k].title)+'</button>'}).join('')+
  '<p class="ka-nav-h">Projects</p>'+DATA.projects.map(function(p,i){return '<div class="ka-proj'+(sel.sec==='proj'&&sel.pi===i?' on':'')+'"><button type="button" data-proj="'+i+'"><i style="background:'+E(p.tone&&p.tone.bg)+'"></i>'+E(p.name)+(p.show===false?' <em>hidden</em>':'')+'</button><span><button type="button" class="ka-ic" data-pmv="'+i+'|-1" title="Move up">↑</button><button type="button" class="ka-ic" data-pmv="'+i+'|1" title="Move down">↓</button></span></div>'}).join('')+
  '<button type="button" class="ka-add" data-padd="1">+ New project</button></nav>'}
function body(){
 uid=0;
 if(sel.sec!=='proj'){var S=SECTIONS[sel.sec];return '<h2>'+E(S.title)+'</h2>'+S.f.map(function(f){return field(f,DATA,'')}).join('')}
 var p=DATA.projects[sel.pi],base='projects.'+sel.pi;
 return '<h2>'+E(p.name)+'</h2><div class="ka-tabs">'+Object.keys(PTABS).map(function(k){return '<button type="button" data-tab="'+k+'" class="'+(sel.tab===k?'on':'')+'">'+E(PTABS[k].title)+'</button>'}).join('')+'</div>'+
  PTABS[sel.tab].f.map(function(f){return field(f,p,base)}).join('')+
  '<div class="ka-danger"><button type="button" class="ka-sm" data-pdup="'+sel.pi+'">Duplicate project</button><button type="button" class="ka-sm ka-del" data-pdel="'+sel.pi+'">Delete project</button></div>'}
function status(msg,kind){var s=document.querySelector('.ka-status');if(s){s.textContent=msg||'';s.className='ka-status '+(kind||'')}}
function bar(){var ch=JSON.stringify(DATA)!==SAVED;dirty=ch;
 var st=document.querySelector('.ka-stats');if(st){var su=DATA.site.statsUrl||'';st.hidden=!/^https?:/.test(su);st.href=su||'#'}
 var b=document.querySelector('.ka-save');if(b){b.disabled=!ch||!ART;b.textContent=ch?'Publish changes':'Published'}
 var d=document.querySelector('.ka-dirty');if(d)d.hidden=!ch}
function paint(keepScroll){
 var pn=document.querySelector('.ka-body'),sc=pn?pn.scrollTop:0;
 document.querySelector('.ka-side').innerHTML=nav();
 pn.innerHTML=body();if(keepScroll)pn.scrollTop=sc;else pn.scrollTop=0;
 bar();
}
var rt;
function preview(now){clearTimeout(rt);rt=setTimeout(function(){
 var y=window.scrollY;window.KS.render(DATA,document.getElementById('app'),{keep:true});showPreview();window.scrollTo(0,y);lsSet(JSON.stringify(DATA)===SAVED?null:JSON.stringify(DATA));bar()},now?0:250)}
function showPreview(){
 var v=sel.sec==='proj'?(DATA.projects[sel.pi]||{}).slug:SECTIONS[sel.sec].view;
 var vs=[].slice.call(document.querySelectorAll('#app .view')),ok=vs.some(function(x){return x.dataset.view===v});

/* ---------- events ---------- */
function onInput(e){var t=e.target;
 if(t.dataset.sync){var tx=document.getElementById(t.dataset.sync);tx.value=t.value;tx.dispatchEvent(new Event('input',{bubbles:true}));return}
 if(!t.dataset.p)return;
 var v=t.dataset.bool?t.checked:t.dataset.lines?t.value.split('\n').map(function(s){return s.trim()}).filter(Boolean):t.value;
 if(/\.col$/.test(t.dataset.p))v=+v;
 if(/^projects\.\d+\.slug$/.test(t.dataset.p))v=slugify(v);
 set(DATA,t.dataset.p,v);
 var sw=t.parentNode.querySelector('.ka-sw');if(sw)sw.style.background=t.value;
 if(/^projects\.\d+\.name$/.test(t.dataset.p)){var h2=document.querySelector('.ka-body h2');if(h2)h2.textContent=v}
 if(/\.name$/.test(t.dataset.p)||/\.show$/.test(t.dataset.p)||/tone\.bg$/.test(t.dataset.p))document.querySelector('.ka-side').innerHTML=nav();
 preview();
}
function arrAt(path){return get(DATA,path)}
function onClick(e){var b=e.target.closest('button');if(!b)return;var d=b.dataset,x;
 if(d.sec){sel={sec:d.sec,pi:0,tab:'card'};paint();window.scrollTo(0,0);preview(true);return}
 if(d.proj!=null){sel={sec:'proj',pi:+d.proj,tab:sel.sec==='proj'?sel.tab:'card'};paint();window.scrollTo(0,0);preview(true);return}
 if(d.tab){sel.tab=d.tab;paint();showPreview();if(d.tab!=='card')scrollPreviewTo(d.tab);return}
 if(d.add){var f=findList(d.add),arr=arrAt(d.add)||[];arr.push(clone(f.blank));set(DATA,d.add,arr);sel.openItem=d.add+'.'+(arr.length-1);paint(true);preview();return}
 if(d.mv){x=d.mv.split('|');var A=arrAt(x[0]),i=+x[1],j=i+(+x[2]);if(j<0||j>=A.length)return;A.splice(j,0,A.splice(i,1)[0]);e.preventDefault();paint(true);preview();return}
 if(d.dup){x=d.dup.split('|');var A2=arrAt(x[0]);A2.splice(+x[1]+1,0,clone(A2[+x[1]]));e.preventDefault();paint(true);preview();return}
 if(d.del){e.preventDefault();if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='Sure?';setTimeout(function(){b.classList.remove('arm');b.textContent='✕'},2500);return}
  x=d.del.split('|');arrAt(x[0]).splice(+x[1],1);paint(true);preview();return}
 if(d.padd){var np=blankProject(DATA.projects.length+1);while(DATA.projects.some(function(p){return p.slug===np.slug}))np.slug+='-x';DATA.projects.push(np);sel={sec:'proj',pi:DATA.projects.length-1,tab:'card'};paint();preview();status('New project added. It stays hidden until you tick “Published”.','');return}
 if(d.pmv){x=d.pmv.split('|');var P=DATA.projects,pi=+x[0],pj=pi+(+x[1]);if(pj<0||pj>=P.length)return;P.splice(pj,0,P.splice(pi,1)[0]);if(sel.sec==='proj'&&sel.pi===pi)sel.pi=pj;paint(true);preview();return}
 if(d.pdup){var cp=clone(DATA.projects[+d.pdup]);cp.slug+='-copy';cp.name+=' (copy)';cp.show=false;DATA.projects.splice(+d.pdup+1,0,cp);sel.pi=+d.pdup+1;paint();preview();return}
 if(d.pdel){if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='Click again to delete';setTimeout(function(){b.classList.remove('arm');b.textContent='Delete project'},3000);return}
  DATA.projects.splice(+d.pdel,1);sel={sec:'site',pi:0,tab:'card'};paint();preview();return}
 if(d.clear){set(DATA,d.clear,'');paint(true);preview();return}
 if(b.classList.contains('ka-save'))return save();
 if(b.classList.contains('ka-close'))return close();
 if(b.classList.contains('ka-revert')){DATA=JSON.parse(SAVED);lsSet(null);paint();preview(true);status('Changes discarded.','');return}
 if(b.classList.contains('ka-export'))return exportFile('site.json',JSON.stringify(DATA,null,1),'application/json');
 if(b.classList.contains('ka-exporthtml')){status('Preparing your site file…','');return standalone().then(function(h){exportFile('index.html',h,'text/html')})}
 if(b.classList.contains('ka-import'))return document.querySelector('.ka-importf').click();
 if(b.classList.contains('ka-pvtoggle'))return document.querySelector('.ka').classList.toggle('pv');
}
function scrollPreviewTo(tab){var v=document.querySelector('#app .view:not([hidden])');if(!v)return;var el=tab==='summary'?v.querySelector('.summary'):tab==='demo'?v.querySelector('.vx-demo'):v.querySelector('.case-statement');if(el)el.scrollIntoView({block:'start'})}
function findList(path){var parts=path.split('.'),fs=sel.sec==='proj'?PTABS[sel.tab].f:SECTIONS[sel.sec].f;
 var key=sel.sec==='proj'?parts.slice(2).join('.'):path;key=key.replace(/\.\d+\./g,'.');
 function walk(list,pre){for(var i=0;i<list.length;i++){var f=list[i];if(f.t!=='list')continue;var k=pre?pre+'.'+f.k:f.k;if(k===key)return f;var r=walk(f.f,k);if(r)return r}}
 return walk(fs,'')}
function onChange(e){var t=e.target;
 if(t.dataset.snip&&t.value){var ta=t.closest('.ka-screen').querySelector('textarea');var s=SNIP[t.value];
  var pos=ta.selectionStart!=null&&document.activeElement===ta?ta.selectionStart:ta.value.length;ta.value=ta.value.slice(0,pos)+s+ta.value.slice(pos);t.value='';ta.dispatchEvent(new Event('input',{bubbles:true}));return}
 if(t.dataset.up&&t.files&&t.files[0]){var path=t.dataset.up;status('Uploading…','');
  var fl=t.files[0],nk=t.dataset.name;ASSETS.upload(fl).then(function(r){set(DATA,path,r.url);if(nk&&!get(DATA,nk))set(DATA,nk,fl.name);paint(true);preview();status('Uploaded. Publish to make it live.','ok')}).catch(function(err){status('Upload failed: '+(err&&err.message||err),'err')});return}
 if(t.classList.contains('ka-importf')&&t.files[0]){t.files[0].text().then(function(tx){try{var j=JSON.parse(tx);if(!j.site||!j.projects)throw new Error('Not a portfolio file');DATA=j;paint();preview(true);status('Imported. Review it, then publish.','ok')}catch(err){status('Could not import: '+err.message,'err')}});t.value=''}
}

/* ---------- save / export ---------- */
function save(){if(!ART)return;var b=document.querySelector('.ka-save');b.disabled=true;b.textContent='Publishing…';status('','');
 var json=JSON.stringify(DATA,null,1);
 ART.publish({'site.json':{content:json,contentType:'application/json'}}).then(function(){SAVED=JSON.stringify(DATA);lsSet(null);bar();status('Published. Everyone now sees the new version.','ok')}).catch(function(err){
  var c=err&&err.code;bar();
  if(c==='conflict')status('Someone published a newer version, so the page is reloading. Your draft is kept in this browser.','err');
  else if(c==='not_writer'||c==='not_granted'||c==='capability_disabled'||c==='consent_required')status('Saving isn’t available in this view. Use Export to keep your changes.','err');
  else if(c==='too_large')status('The site data is too large to save.','err');
  else if(c==='rate_limited')status('Too many saves in a row. Wait a moment and try again.','err');
  else status('Couldn’t publish ('+(c||'error')+'). Try again in a moment.','err')})}
function exportFile(name,text,type){
 if(DL){DL.save({filename:name,data:new Blob([text],{type:type})}).then(function(){status('Saved '+name+'.','ok')}).catch(function(){status('Download cancelled.','')});return}
 try{var u=URL.createObjectURL(new Blob([text],{type:type})),l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(u)},2000)}catch(e){status('Download isn’t available here.','err')}}
function blobToData(u){return fetch(u).then(function(r){if(!r.ok)throw 0;return r.blob()}).then(function(b){return new Promise(function(res){var fr=new FileReader();fr.onload=function(){res(fr.result)};fr.onerror=function(){res(u)};fr.readAsDataURL(b)})}).catch(function(){return u})}
function standalone(){
 var css=document.getElementById('site-css').textContent, js=document.getElementById('site-js').textContent;
 var json=JSON.stringify(DATA), blobs=json.match(/\/_blob\/[A-Za-z0-9_-]+/g)||[], uniq=blobs.filter(function(x,i){return blobs.indexOf(x)===i});
 var an=DATA.site.analytics!==false?'<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)}<\/script><script defer src="/_vercel/insights/script.js"><\/script>':'';
 return Promise.all(uniq.map(blobToData)).then(function(datas){
  var d=JSON.parse(json);var str=JSON.stringify(d);uniq.forEach(function(u,i){str=str.split(u).join(datas[i])});
  return '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>'+E(DATA.site.title)+'</title><style id="site-css">'+css+'</style><style id="theme-css"></style>'+an+'</head><body><div id="app"></div><script type="application/json" id="seed">'+str.replace(/</g,'\\u003c')+'<\/script><script id="site-js">'+js+'<\/script></body></html>'})}

/* ---------- open / close ---------- */
function shell(){
 var w=document.createElement('div');w.className='ka';w.innerHTML='<div class="ka-panel"><div class="ka-top"><b>Portfolio dashboard</b><span class="ka-dirty" hidden>Unpublished changes</span><a class="ka-sm ka-stats" target="_blank" rel="noreferrer" hidden>📊 Visitors</a><button type="button" class="ka-pvtoggle ka-sm">Preview</button><button type="button" class="ka-close ka-sm" title="Close">Close</button></div>'+
  '<div class="ka-cols"><div class="ka-side"></div><div class="ka-body"></div></div>'+
  '<div class="ka-foot"><button type="button" class="ka-save">Published</button><button type="button" class="ka-sm ka-revert">Discard changes</button><span class="ka-more"><button type="button" class="ka-sm ka-export">Export data</button><button type="button" class="ka-sm ka-import">Import</button><button type="button" class="ka-sm ka-exporthtml">Download site HTML</button><input type="file" class="ka-importf" accept="application/json" hidden></span><p class="ka-status" role="status"></p></div></div>'+
  '<p class="ka-pv-note" hidden>This project is hidden. Tick “Published” on the Card tab to see it here.</p>';
 document.body.appendChild(w);
 w.addEventListener('input',onInput);w.addEventListener('change',onChange);w.addEventListener('click',onClick);
}
function openAdmin(){if(open)return;open=true;document.documentElement.classList.add('ka-on');
 if(!document.querySelector('.ka'))shell();
 var dr=lsGet();if(dr==='stale'){setTimeout(function(){status('An older unpublished draft in this browser was out of date, so it was discarded. You are editing the latest published version.','')},50)}else if(dr){try{var j=JSON.parse(dr);if(JSON.stringify(j)!==SAVED){DATA=j;setTimeout(function(){status('Restored your unpublished draft from this browser.','')},50)}}catch(e){}}
 document.querySelector('.ka').hidden=false;paint();preview(true);
 if(!ART)status('Saving isn’t available in this view. Edits are kept in this browser; use Export to download them.','err');
}
function close(){open=false;document.documentElement.classList.remove('ka-on');document.querySelector('.ka').hidden=true;
 if(dirty)window.KS.render(JSON.parse(SAVED),document.getElementById('app'));if(location.hash==='#admin')history.replaceState(null,'',location.pathname+location.search);
 var fb=document.querySelector('.ka-fab');if(fb)fb.hidden=false}

window.KS_admin=function(data){
 DATA=clone(data);SAVED=JSON.stringify(data);
 if(!(window.claude&&claude.use))return;
 claude.use('user').then(function(u){
  if(!(u&&(u.isOwner()||u.canEdit())))return;
  var fab=document.createElement('button');fab.type='button';fab.className='ka-fab';fab.innerHTML='✎ Edit site';fab.onclick=function(){fab.hidden=true;openAdmin()};document.body.appendChild(fab);
  if(location.hash==='#admin'){fab.hidden=true;openAdmin()}
  window.addEventListener('hashchange',function(){if(location.hash==='#admin'){fab.hidden=true;openAdmin()}});
 });
 claude.use('artifact').then(function(a){ART=a;bar()});
 claude.use('assets').then(function(a){ASSETS=a});
 claude.use('downloads').then(function(d){DL=d});
};
})();

(function(){
 var app=document.getElementById('app'),seed=JSON.parse(document.getElementById('seed').textContent),done=false;
 function go(d){if(done)return;done=true;window.KS.render(d,app);window.KS_admin&&window.KS_admin(d)}
 var t=setTimeout(function(){go(seed)},2500);
 try{fetch('site.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){clearTimeout(t);go(d&&d.site&&d.projects?d:seed)},function(){clearTimeout(t);go(seed)})}catch(e){clearTimeout(t);go(seed)}
})();
</script></body></html>

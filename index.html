:root{--black:#000;--white:#fff;--lime:#d4f33f;--grey:#b8b8be;--light:#f1f1f5;--ash:#8e8e95;--line:#2a2a2e;--focus:#d4f33f;--tangerine:#ff7a3d;--sky:#7cc8ff;--bubblegum:#ff9ad5;--violet:#9b7bff;--font:"Archivo Variable", "Helvetica Neue", Arial, sans-serif;--gutter:clamp(16px, 4vw, 56px);--max:1320px;--radius:14px}
*,:before,:after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--black);color:var(--white);font-family:var(--font);-webkit-font-smoothing:antialiased;margin:0;font-size:1.0625rem;line-height:1.55}
::selection{background:var(--lime);color:var(--black)}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:4px}
h1,h2,h3{margin:0}
p{margin:0 0 1em}
.wrap{width:100%;max-width:var(--max);padding-inline:var(--gutter);margin:0 auto}
.skip{background:var(--lime);color:var(--black);z-index:20;padding:8px 12px;position:absolute;top:8px;left:-999px}
.skip:focus{left:8px}
.giant,.wordmark,.case-name{font-variation-settings:"wdth" 125;text-transform:uppercase;letter-spacing:-.03em;font-weight:900;line-height:.86}
.giant{font-size:clamp(2.8rem,9vw,7.5rem)}
.top{z-index:10;background:var(--black);position:sticky;top:0}
.top-in{justify-content:space-between;align-items:center;height:64px;display:flex}
.mark{text-transform:uppercase;letter-spacing:.01em;font-weight:800;text-decoration:none}
.top nav{gap:clamp(16px,3vw,32px);display:flex}
.top nav a{color:var(--ash);font-weight:500;text-decoration:none}
.top nav a:hover{color:var(--white)}
.band{width:100%}
.band-lime,.tone-lime{background:var(--lime);color:var(--black)}
.band-grey,.tone-grey{background:var(--grey);color:var(--black)}
.band-light,.tone-light{background:var(--light);color:var(--black)}
.tone-black{color:var(--white);background:#161618}
.tone-orange{background:var(--tangerine);color:var(--black)}
.tone-valuespace{color:#fff;--mark:#fff;background:#5b3e9e}
.tone-freshlink{color:#fff;--mark:#fff;background:#1f5e3b}
.tone-fitverse{color:#fff;--mark:#fff;background:linear-gradient(160deg,#e8743b 0%,#b84a1c 55%,#5e2610 100%)}
.tone-nisarga{color:#2f2a1e;--mark:#6b4e2e;background:#efe6d2}
.wordmark-wrap{padding-block:clamp(20px,3.2vw,44px) clamp(14px,2vw,24px)}
.wordmark{font-size:min(calc((100vw - 2 * var(--gutter)) / 8.05), calc((var(--max) - 112px) / 8.05));white-space:nowrap;margin:0;line-height:.8}
.intro{padding-block:clamp(56px,10vw,140px) clamp(64px,9vw,120px)}
.intro-h{letter-spacing:-.035em;margin-bottom:clamp(40px,6vw,72px);font-size:clamp(2.4rem,6.6vw,5.6rem);font-weight:700;line-height:1.02}
.intro-h>span{display:block}
.intro-sub{color:var(--ash)}
.wave{display:inline-block}
.intro-grid,.about-grid{grid-template-columns:minmax(0,1fr) minmax(0,2.2fr);gap:16px 48px;display:grid}
.intro-label{color:var(--ash);margin:0;font-weight:600}
.intro-current{align-items:baseline;gap:12px;font-size:clamp(1.15rem,1.8vw,1.4rem);font-weight:600;display:flex}
.intro-bio{color:#d6d6db;max-width:60ch}
.dot{background:var(--lime);border-radius:50%;flex:none;width:10px;height:10px;transform:translateY(-1px)}
.text-link{-webkit-text-decoration-color:var(--lime);text-decoration-color:var(--lime);text-underline-offset:5px;font-weight:700;text-decoration-thickness:2px}
.text-link:hover{color:var(--lime)}
.reveal{opacity:0;animation:.8s cubic-bezier(.2,.7,.1,1) forwards rise;transform:translateY(18px)}
.r1{animation-delay:.12s}
.r2{animation-delay:.32s}
.r3{animation-delay:.56s}
@keyframes rise{to{opacity:1;transform:none}
}
.section-h{letter-spacing:-.02em;border-bottom:1px solid var(--line);margin-bottom:32px;padding-bottom:16px;font-size:clamp(1.4rem,2.4vw,1.9rem);font-weight:700}
.section-h-dark{border-color:#0000002e}
.work{padding-bottom:clamp(72px,10vw,140px)}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(36px,5vw,64px) clamp(20px,3vw,36px);display:grid}
.card{text-decoration:none;display:block}
.thumb{isolation:isolate;aspect-ratio:4/3;border-radius:var(--radius);max-width:100%;margin-bottom:18px;position:relative;overflow:hidden}
.thumb img{object-fit:cover;width:100%;height:100%;transition:opacity .45s,transform .7s cubic-bezier(.2,.7,.1,1);position:absolute;inset:0}
.thumb-glimpse-img{opacity:0;transform:scale(1.04)}
.thumb-placeholder{flex-direction:column;justify-content:space-between;padding:clamp(16px,2vw,24px);display:flex;position:absolute;inset:0}
.thumb-placeholder-name{letter-spacing:-.02em;font-size:clamp(1.1rem,1.8vw,1.4rem);font-weight:700}
.thumb{container-type:inline-size}
@media (hover:hover){.card:hover .thumb-watermark{opacity:.5;transition:opacity .3s}
}
.tone-outline{color:var(--ash);background:0 0;border:2px dashed #3a3a40;transition:border-color .25s,color .25s,transform .26s cubic-bezier(.3,1.4,.5,1)}
.card:hover .tone-outline,.card:focus-visible .thumb{container-type:inline-size}
.thumb-placeholder .chips{z-index:1;position:relative}
.thumb-num{z-index:1;position:absolute;top:clamp(16px,2vw,24px);right:clamp(16px,2vw,24px)}
.thumb-watermark{font-variation-settings:"wdth" 125;text-transform:uppercase;letter-spacing:-.03em;color:var(--mark,currentColor);opacity:.38;pointer-events:none;-webkit-user-select:none;user-select:none;font-size:10cqi;font-weight:900;line-height:.86;position:absolute;bottom:clamp(10px,1.6vw,18px);left:clamp(14px,2vw,22px);right:clamp(14px,2vw,22px)}
@media (hover:hover){.card:hover .thumb-watermark{opacity:.5;transition:opacity .3s}
}
.tone-outline{border-color:var(--lime);color:var(--lime)}
.card-wide{grid-column:1/-1}
.card-wide .thumb{aspect-ratio:auto;min-height:clamp(160px,18vw,240px)}
.card-wide .thumb-placeholder-name{font-variation-settings:"wdth" 125;text-transform:uppercase;letter-spacing:-.03em;font-size:clamp(2rem,6vw,4.5rem);font-weight:900;line-height:.9}
.glimpse{z-index:2;color:var(--white);-webkit-backdrop-filter:blur(6px);background:#000000db;padding:clamp(18px,2.4vw,28px);transition:transform .42s cubic-bezier(.2,.7,.1,1);position:absolute;inset:auto 0 0;transform:translateY(101%)}
.glimpse-h{color:var(--lime);margin:0 0 10px;font-size:.9rem;font-weight:700}
.glimpse ul{flex-wrap:wrap;gap:8px;margin:0 0 16px;padding:0;list-style:none;display:flex}
.glimpse li{border:1.5px solid #fff6;border-radius:999px;padding:4px 12px;font-size:.9rem;font-weight:600}
.glimpse-cta{text-decoration:underline;-webkit-text-decoration-color:var(--lime);text-decoration-color:var(--lime);text-underline-offset:5px;font-weight:700;text-decoration-thickness:2px}
@media (hover:hover){.card:hover .glimpse,.card:focus-visible .glimpse{transform:none}
.card:hover .thumb-glimpse-img,.card:focus-visible .thumb-glimpse-img{opacity:1;transform:none}
.card:hover .thumb-cover-img{transform:scale(1.04)}
.card:hover .card-title{text-decoration:underline;-webkit-text-decoration-color:var(--lime);text-decoration-color:var(--lime);text-underline-offset:5px;text-decoration-thickness:2px}
}
@media (hover:none){.glimpse{display:none}
}
.thumb-num{align-self:flex-end;font-weight:800}
.chips{flex-wrap:wrap;gap:8px;max-width:85%;margin:0;padding:0;list-style:none;display:flex}
.chips li{border:1.5px solid;border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:600}
.card-title{letter-spacing:-.02em;margin-bottom:6px;font-size:clamp(1.3rem,2vw,1.6rem);font-weight:700}
.card-summary{color:#c9c9cf;max-width:54ch;margin-bottom:8px}
.card-when{color:var(--ash);margin:0;font-size:.9rem}
.contact{padding-block:clamp(64px,9vw,120px)}
.contact .giant{max-width:10ch;margin-bottom:24px}
.contact-copy{max-width:46ch;font-size:1.15rem}
.actions{flex-wrap:wrap;gap:12px;margin-top:28px;display:flex}
.btn{background:var(--black);color:var(--white);border:2px solid var(--black);border-radius:999px;padding:14px 24px;font-weight:700;text-decoration:none;display:inline-block}
.btn:hover{background:var(--white);color:var(--black)}
.btn-ghost{color:var(--black);background:0 0}
.btn-ghost:hover{background:var(--black);color:var(--lime)}
.btn-lime{background:var(--lime);color:var(--black);border-color:var(--lime)}
.btn-lime:hover{background:var(--white);border-color:var(--white)}
.foot{border-top:1px solid var(--line);padding-block:40px 48px}
.foot-row{flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 24px;display:flex}
.foot-mark{text-transform:uppercase;font-size:1.1rem;font-weight:800;text-decoration:none}
.foot-loc{color:var(--ash)}
.foot-links{justify-content:flex-start;gap:12px clamp(18px,3vw,28px);margin-top:28px}
.foot-links a{color:var(--ash);font-weight:600;text-decoration:none}
.foot-links a:hover{color:var(--white)}
.page-head{padding-block:clamp(56px,9vw,120px) clamp(40px,5vw,64px)}
.about-grid{padding-bottom:clamp(56px,8vw,104px)}
.about-copy{color:#d6d6db;max-width:62ch}
.lead{color:var(--white);letter-spacing:-.01em;font-size:clamp(1.3rem,2.2vw,1.7rem);font-weight:600;line-height:1.35}
.band-light .wrap{padding-block:clamp(56px,8vw,104px)}
.path{grid-template-columns:repeat(4,minmax(0,1fr));gap:36px 28px;margin:0;padding:0;list-style:none;display:grid}
.path li{border-top:3px solid var(--black);flex-direction:column;gap:2px;padding-top:12px;display:flex}
.path li:last-child{border-color:#8da81f}
.path-when{font-variation-settings:"wdth" 125;text-transform:uppercase;letter-spacing:-.02em;font-size:1.5rem;font-weight:900}
.path-what{font-weight:700;line-height:1.3}
.path-where{color:#55555b;font-size:.95rem}
.about-tools{padding-top:clamp(56px,8vw,104px)}
.chips-lg{max-width:none}
.chips-lg li{padding:6px 16px;font-size:1rem}
.case-hero{flex-direction:column;gap:20px;padding-block:clamp(28px,4vw,48px);display:flex;container-type:inline-size}
.back{font-weight:700;text-decoration:none}
.back:hover{text-decoration:underline}
.case-name{font-size:min(12rem, calc(100cqi / (var(--w,10) * .88)));margin:clamp(24px,6vw,80px) 0 4px -.03em;line-height:.82}
.case-statement{padding-block:clamp(48px,7vw,96px)}
.case-statement p{letter-spacing:-.03em;max-width:26ch;margin:0;font-size:clamp(1.6rem,3.6vw,3rem);font-weight:700;line-height:1.1}
.summary{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px clamp(32px,5vw,72px);display:grid}
.summary h3{color:var(--lime);margin-bottom:8px;font-size:1.05rem;font-weight:700}
.summary p,.summary ul{color:#d6d6db;max-width:58ch;margin:0 0 32px}
.summary ul{padding-left:1.1em}
.summary li{margin-bottom:.5em}
.facts{border-top:1px solid var(--line);grid-template-columns:2fr 1.4fr 1fr;gap:24px;margin:16px 0 0;padding-top:24px;display:grid}
.facts dt{color:var(--ash);font-size:.9rem}
.facts dd{margin:2px 0 0;font-weight:600;line-height:1.35}
.case-cta{margin:40px 0 0}
.next{border-top:1px solid var(--line);flex-direction:column;margin-top:clamp(72px,10vw,140px);padding-top:24px;text-decoration:none;display:flex}
.next-label{color:var(--ash);font-weight:600}
.next-name{font-variation-settings:"wdth" 125;text-transform:uppercase;letter-spacing:-.03em;font-size:clamp(2.6rem,8vw,6.5rem);font-weight:900;line-height:.9}
.next:hover .next-name{color:var(--lime)}
@media (max-width:900px){.path{grid-template-columns:repeat(2,minmax(0,1fr))}
.facts{grid-template-columns:1fr 1fr}
}
@media (max-width:680px){.grid,.intro-grid,.about-grid,.summary{grid-template-columns:1fr}
.path{grid-template-columns:1fr;gap:20px}
.facts{grid-template-columns:1fr;gap:14px}
}
@media (max-width:400px){.top nav{gap:14px;font-size:.95rem}
.mark{font-size:.95rem}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}
.reveal{opacity:1;animation:none;transform:none}
.thumb img,.glimpse{transition:none}
}
.off .wrap{padding-block:clamp(56px,8vw,104px)}
.off-head{flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px 40px;margin-bottom:clamp(40px,5vw,64px);display:flex}
.off-sub{max-width:30ch;margin:0;font-size:clamp(1.1rem,1.6vw,1.3rem);font-weight:600}
.off-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(28px,3vw,40px);margin:0;padding:0;list-style:none;display:grid}
.off-card{background:var(--card,var(--white));min-width:0;color:var(--black);border:3px solid var(--black);box-shadow:8px 8px 0 var(--black);border-radius:22px;padding:clamp(28px,3vw,36px) clamp(20px,2.4vw,28px) clamp(22px,2.4vw,28px);transition:transform .26s cubic-bezier(.3,1.6,.5,1),box-shadow .26s;position:relative}
.off-card-1{--card:var(--tangerine);--pop:var(--lime);transform:rotate(-2deg)}
.off-card-2{--card:var(--sky);--pop:var(--bubblegum);transform:rotate(1.5deg)translateY(18px)}
.off-card-3{--card:var(--bubblegum);--pop:var(--sky);transform:rotate(-1deg)}
.off-sticker{background:var(--black);color:var(--lime);font-variation-settings:"wdth" 120;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;border-radius:999px;padding:6px 14px;font-size:.85rem;font-weight:900;transition:transform .26s cubic-bezier(.3,1.6,.5,1);position:absolute;top:-18px;left:20px;transform:rotate(-5deg)}
.off-card-2 .off-sticker{left:auto;right:20px;transform:rotate(4deg)}
.off-art{color:var(--black);margin:8px 0 18px}
.off-art svg{width:100%;height:auto;max-height:150px;display:block}
.off-title{letter-spacing:-.02em;margin-bottom:6px;font-size:clamp(1.3rem,2vw,1.6rem);font-weight:800}
.off-text{color:var(--black);margin:0}
.off{background:var(--violet)}
.off-sub{color:var(--black)}
@media (hover:hover){.off-card:hover{box-shadow:12px 14px 0 var(--black);transform:rotate(0)translateY(-6px)}
.off-card:hover .off-sticker{transform:rotate(-10deg)scale(1.08)}
.off-card-2:hover .off-sticker{transform:rotate(9deg)scale(1.08)}
}
@media (max-width:900px){.off-grid{grid-template-columns:1fr;gap:44px;max-width:520px}
.off-card-2{transform:rotate(1.5deg)}
}
@media (prefers-reduced-motion:reduce){.off-card,.off-sticker{transition:none}
}
.stats{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:16px;margin:clamp(32px,4vw,56px) 0 0;display:grid}
.stat{border-top:2px solid var(--lime);flex-direction:column-reverse;gap:6px;min-width:0;padding-top:14px;display:flex}
.stat dd{font-variation-settings:"wdth" 125;letter-spacing:-.03em;color:var(--lime);font-variant-numeric:tabular-nums;margin:0;font-size:clamp(2.4rem,5vw,4rem);font-weight:900;line-height:.9}
.stat dt{color:var(--ash);font-size:.95rem;line-height:1.35}
.case-cta{border:1px solid var(--line);border-radius:var(--radius);flex-wrap:wrap;align-items:center;gap:16px 24px;margin:48px 0 0;padding:clamp(24px,3vw,36px);display:flex}
.case-cta-h{letter-spacing:-.02em;flex-basis:100%;margin:0;font-size:clamp(1.3rem,2.2vw,1.7rem);font-weight:700}
.case-more{flex-wrap:wrap;gap:10px;margin:0;padding:0;list-style:none;display:flex}
.case-more a{color:#d6d6db;border:1.5px solid #3a3a40;border-radius:999px;padding:10px 16px;font-weight:600;text-decoration:none;transition:border-color .2s,color .2s,transform .2s;display:inline-block}
.case-more a:hover{border-color:var(--lime);color:var(--lime)}
@media (max-width:680px){.stats{grid-template-columns:1fr;gap:0}
.stat{border-top-width:1px;flex-direction:row-reverse;justify-content:flex-end;align-items:center;gap:16px;padding-block:14px}
.stat dd{min-width:3.4ch}
}
.line{display:block}
main{overflow-x:clip}
.btn,.case-more a,.card .thumb,.top nav a,.foot-links a,.off-card{-webkit-tap-highlight-color:transparent}
.btn{transition:background .2s,color .2s,border-color .2s,transform .16s cubic-bezier(.3,1.6,.5,1)}
.btn:active,.case-more a:active{transform:scale(.95)}
.card .thumb{transition:transform .26s cubic-bezier(.3,1.4,.5,1)}
.card:active .thumb{transform:scale(.97)}
.top nav a{transition:color .2s;position:relative}
.top nav a:after{content:"";background:var(--lime);transform-origin:0;height:2px;transition:transform .26s cubic-bezier(.2,.7,.1,1);position:absolute;bottom:-4px;left:0;right:0;transform:scaleX(0)}
.top nav a:hover:after,.top nav a:focus-visible:after{transform:scaleX(1)}
.wave{transform-origin:70% 75%;cursor:default}
@media (prefers-reduced-motion:no-preference){.wave{animation:1.6s ease-in-out .9s wave}
.wave:hover,.wave:active{animation:1.2s ease-in-out infinite wave}
}
@keyframes wave{0%,60%,to{rotate:0deg}
10%,30%{rotate:16deg}
20%,40%{rotate:-10deg}
50%{rotate:8deg}
}
.glimpse li{transition:opacity .3s,translate .3s cubic-bezier(.2,.7,.1,1)}
@media (hover:hover){.card .glimpse li{opacity:0;translate:0 10px}
.card:hover .glimpse li,.card:focus-visible .glimpse li{opacity:1;translate:0}
.card:hover .glimpse li:nth-child(2){transition-delay:60ms}
.card:hover .glimpse li:nth-child(3){transition-delay:.12s}
.card:hover .glimpse li:nth-child(4){transition-delay:.18s}
.card:hover .glimpse li:nth-child(5){transition-delay:.24s}
}
@supports (animation-timeline:view()){@media (prefers-reduced-motion:no-preference){.slide-in,.slide-in-r,.rise-in,.pop-in{animation-timing-function:cubic-bezier(.2,.7,.1,1);animation-fill-mode:both;animation-timeline:view();animation-range:entry cover 35%}
.slide-in{animation-name:from-left}
.slide-in-r{animation-name:from-right}
.rise-in{animation-name:rise-up}
.pop-in{animation-name:pop;animation-range:entry cover 40%}
@media (hover:none){.card{view-timeline:--card block}
.glimpse{background:#000000ed;flex-direction:column;justify-content:flex-end;animation:linear both peek;animation-timeline:--card;animation-range:cover;display:flex;inset:0}
.thumb-glimpse-img{animation:linear both peek-img;animation-timeline:--card;animation-range:cover}
.glimpse li{animation:linear both chip;animation-timeline:--card;animation-range:cover}
.glimpse li:nth-child(2){animation-range:cover 3%}
.glimpse li:nth-child(3){animation-range:cover 6%}
.glimpse li:nth-child(4){animation-range:cover 9%}
.glimpse li:nth-child(5){animation-range:cover 12%}
}
}
}
@keyframes from-left{0%{opacity:0;translate:-14vw}
to{opacity:1;translate:0}
}
@keyframes from-right{0%{opacity:0;translate:14vw}
to{opacity:1;translate:0}
}
@keyframes rise-up{0%{opacity:0;translate:0 60px;scale:.94}
to{opacity:1;translate:0;scale:1}
}
@keyframes pop{0%{opacity:0;translate:0 80px;scale:.8}
70%{scale:1.03}
to{opacity:1;translate:0;scale:1}
}
@keyframes peek{0%,30%{transform:translateY(101%)}
45%,70%{transform:none}
85%,to{transform:translateY(101%)}
}
@keyframes peek-img{0%,30%{opacity:0}
45%,70%{opacity:1}
85%,to{opacity:0}
}
@keyframes chip{0%,36%{opacity:0;translate:0 10px}
48%,70%{opacity:1;translate:0}
85%,to{opacity:0}
}
.tapes{isolation:isolate;place-items:center;height:clamp(180px,24vw,320px);display:grid;position:relative;overflow:clip}
.tape{white-space:nowrap;font-variation-settings:"wdth" 125;text-transform:uppercase;letter-spacing:-.02em;font-weight:900;position:absolute;left:-6%;right:-6%;overflow:hidden;box-shadow:0 10px 30px #00000073}
.tape:before,.tape:after{content:"";z-index:1;background:repeating-linear-gradient(-45deg, var(--black) 0 12px, var(--lime) 12px 24px);height:clamp(6px,.8vw,10px);position:absolute;left:0;right:0}
.tape:before{top:0}
.tape:after{bottom:0}
.tape-front{z-index:2;background:var(--lime);color:var(--black);padding-block:clamp(14px,1.6vw,22px) clamp(10px,1.2vw,18px);font-size:clamp(3rem,10vw,8.5rem);line-height:1;rotate:-4deg}
.tape-back{z-index:1;background:var(--black);color:var(--lime);border-block:1px solid #222;padding-block:clamp(14px,1.6vw,20px);font-size:clamp(1rem,2.4vw,1.9rem);line-height:1;rotate:9deg}
.tape-back:before,.tape-back:after{background:repeating-linear-gradient(-45deg, var(--lime) 0 12px, var(--black) 12px 24px)}
.tape-track{width:max-content;display:flex}
.tape-run{flex:none;display:flex}
.tape-item{align-items:center;display:inline-flex}
.tape-sep{margin-inline:.35em;font-size:.6em;display:inline-block;translate:0 -.08em}
.tape-back .tape-sep{font-size:.9em}
@media (max-width:680px){.tapes{height:clamp(150px,44vw,220px)}
}
@media (prefers-reduced-motion:no-preference){.tape-front .tape-track{animation:26s linear infinite marquee}
.tape-back .tape-track{animation:34s linear infinite reverse marquee}
.tapes:hover .tape-track{animation-play-state:paused}
.tape-front,.tape-back{animation:.9s cubic-bezier(.2,.8,.2,1) both tape-in}
.tape-back{animation-delay:.12s}
}
@keyframes marquee{to{transform:translate(-50%)}
}
@keyframes tape-in{0%{opacity:0;translate:-18%}
to{opacity:1;translate:0}
}


html{color-scheme:dark;background:#000}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:#000}

.tapes{height:clamp(120px,min(14vw,22vh),200px)}

.tape-front{font-size:clamp(2.1rem,min(6vw,9.5vh),5.2rem);padding-block:clamp(10px,1.1vw,16px) clamp(8px,.9vw,13px);rotate:-3deg}

.tape-back{font-size:clamp(.85rem,min(1.6vw,2.6vh),1.35rem);padding-block:clamp(9px,1vw,14px);rotate:7deg}

.intro{padding-block:clamp(28px,min(4.5vw,6vh),64px) clamp(56px,8vw,110px)}

.intro-h{font-size:clamp(2.2rem,min(5.6vw,9vh),5rem);margin-bottom:clamp(28px,min(4vw,5vh),56px)}

@media (max-width:680px){.tapes{height:clamp(110px,30vw,150px)}
}

/* project card hover/hold panel: lighter so the card colour shows through */
.glimpse{background:linear-gradient(to top,rgba(0,0,0,.86) 0%,rgba(0,0,0,.62) 70%,rgba(0,0,0,.38) 100%)!important;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}

@media (hover:none){
 .card{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}

 .card .glimpse{display:block!important;inset:auto 0 0!important;animation:none!important;transform:translateY(101%)!important;transition:transform .38s cubic-bezier(.2,.7,.1,1)!important}

 .card .glimpse li{animation:none!important;opacity:1!important;translate:0!important}

 .card .thumb-glimpse-img{animation:none!important}

 .card.peek .glimpse{transform:none!important}

}


.vx-label{margin:0 0 14px!important;font-size:.8rem!important;max-width:none!important;letter-spacing:.12em!important;text-transform:uppercase;font-weight:800!important;color:var(--lime);line-height:1.2!important}

@media (min-width:761px){.vx-stats{grid-template-columns:repeat(2,minmax(0,1fr))!important;max-width:720px}
.vx-stats .stat{justify-content:flex-end}
}

.vx-chip{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:baseline;margin-top:32px;padding:12px 18px;border:1px solid var(--line);border-radius:12px;background:#151517;color:var(--grey);text-decoration:none;font-size:.95rem;transition:border-color .2s,color .2s}

.vx-chip b{color:var(--white,#fff)}
.vx-chip:hover{border-color:var(--lime);color:#fff}

.vx-tl{margin-top:16px;border:1px solid var(--line);border-radius:var(--radius);background:#121214;overflow:hidden}

.vx-tl summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 22px;font-weight:700;color:var(--grey);transition:color .2s}

.vx-tl summary::-webkit-details-marker{display:none}

.vx-tl summary:hover,.vx-tl[open] summary{color:var(--lime)}

.vx-tl summary i{font-style:normal;font-size:.75rem;transition:transform .25s}

.vx-tl[open] summary i{transform:rotate(180deg)}

.vx-tl ol{list-style:none;margin:0;padding:6px 22px 24px 22px;border-top:1px solid var(--line);position:relative}

.vx-tl li{position:relative;display:grid;gap:2px;padding:16px 0 4px 30px}

.vx-tl li:before{content:"";position:absolute;left:4px;top:22px;width:11px;height:11px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 4px #d4f33f2e,0 0 14px #d4f33f80}

.vx-tl li:not(:last-child):after{content:"";position:absolute;left:9px;top:38px;bottom:-22px;width:1px;background:var(--line)}

.vx-tl time{font-size:.75rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--lime)}

.vx-tl li b{font-size:1.05rem}
.vx-tl li span{color:var(--ash);font-size:.92rem}

.vx-tl[open] li{animation:vxIn .35s both}
.vx-tl[open] li:nth-child(2){animation-delay:.04s}
.vx-tl[open] li:nth-child(3){animation-delay:.08s}
.vx-tl[open] li:nth-child(4){animation-delay:.12s}
.vx-tl[open] li:nth-child(5){animation-delay:.16s}
.vx-tl[open] li:nth-child(6){animation-delay:.2s}
.vx-tl[open] li:nth-child(7){animation-delay:.24s}

@keyframes vxIn{from{opacity:0;transform:translateY(6px)}
to{opacity:1;transform:none}
}

.vx-demo{margin-top:16px;padding:clamp(16px,2.4vw,28px);border:1px solid var(--line);border-radius:var(--radius);background:#121214}

.vx-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}

.vx-toggle{display:inline-flex;padding:4px;border-radius:999px;background:#1d1d20;border:1px solid var(--line)}

.vx-toggle button{font:inherit;font-size:.9rem;font-weight:700;border:0;border-radius:999px;padding:8px 16px;background:none;color:var(--ash);cursor:pointer;transition:background .25s,color .25s}

.vx-toggle button[aria-pressed=true]{background:var(--lime);color:#000}

.vx-hint{font-size:.85rem;color:var(--ash)}

.vx-tiles{display:flex;gap:12px;height:430px}

.vx-demo[data-mode=b] .vx-tile{filter:saturate(.25)}
.vx-demo[data-mode=b] .vx-tile.is-on{filter:none}

.vx-tile{position:relative;flex:1 1 0;min-width:0;border-radius:12px;border:1.5px solid var(--line);background:linear-gradient(170deg,#1b1b22,#121216);overflow:hidden;cursor:pointer;transition:flex-grow .45s cubic-bezier(.3,.9,.3,1),border-color .25s,box-shadow .25s}

.vx-tile:hover{border-color:#d4f33f66}

.vx-tile.is-on{flex-grow:1.9;border-color:var(--lime);box-shadow:0 0 0 1px var(--lime),0 12px 40px #d4f33f1f}

.vx-tile:focus-visible{outline:2px solid var(--lime);outline-offset:2px}

.vx-ico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.2rem;transition:opacity .3s}

.vx-tile.is-on .vx-ico{opacity:0}

.vx-name{position:absolute;left:12px;bottom:12px;z-index:3;padding:4px 10px;border-radius:6px;background:#000c;font-size:.78rem;font-weight:700;color:var(--grey)}

.vx-tile.is-on .vx-name{background:var(--lime);color:#000}

.vx-scr{position:absolute;inset:14px 14px 50px;border-radius:10px;background:#f6f4ee;color:#1d1a24;padding:14px;overflow:hidden;opacity:0;transform:scale(.96);pointer-events:none;transition:opacity .3s,transform .3s;font-size:.8rem;display:flex;flex-direction:column;gap:8px}

.vx-tile.is-on .vx-scr{transition-delay:.12s}

.vx-demo[data-mode=a] .vx-tile.is-on .vx-a,.vx-demo[data-mode=b] .vx-tile.is-on .vx-b{opacity:1;transform:none;pointer-events:auto}

.vx-b{background:#e9e9ec;color:#3a3a40}

.vx-h{margin:0!important;font-size:.95rem!important;font-weight:800!important;letter-spacing:-.01em!important;max-width:none!important;line-height:1.2!important}

.vx-filters{display:flex;gap:6px;flex-wrap:wrap}

.vx-filters button,.vx-days button,.vx-slots button{font:inherit;font-size:.75rem;font-weight:700;border:1.5px solid #5b3e9e55;background:#fff;color:#5b3e9e;border-radius:999px;padding:4px 10px;cursor:pointer;transition:background .2s,color .2s,transform .15s}

.vx-filters button.on,.vx-days button.on,.vx-slots button.on{background:#5b3e9e;color:#fff;border-color:#5b3e9e}

.vx-scr button:active{transform:scale(.94)}

.vx-card{display:flex;gap:10px;align-items:center;background:#fff;border-radius:8px;padding:8px;box-shadow:0 2px 8px #0000000f;transition:opacity .25s,transform .25s}

.vx-card.hide{display:none}

.vx-card div{display:grid;min-width:0}
.vx-card b{font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vx-card small{color:#77737f;font-size:.7rem}
.vx-card em{font-style:normal;font-weight:800;color:#5b3e9e;font-size:.82rem}

.vx-ph{flex:none;width:44px;height:44px;border-radius:6px;background:linear-gradient(135deg,#8f75d1,#5b3e9e)}

.vx-ph.b{background:linear-gradient(135deg,#f0a35c,#c2552c)}
.vx-ph.c{background:linear-gradient(135deg,#7fc59a,#2f7a4e)}
.vx-ph.g{background:#c9c9ce}

.vx-card.dim{background:#f4f4f6;box-shadow:none}
.vx-card.dim b{color:#55555c}

.bad{color:#c4361f!important;font-weight:700}

.vx-ad{margin-top:auto;padding:8px;border-radius:6px;background:#ffd84d;color:#5a4500;font-weight:800;font-size:.7rem;text-align:center}

.vx-map{padding:0;background:#e8efe4}

.vx-map.grey{background:#dedee2;filter:grayscale(1)}

.vx-road{position:absolute;background:#fff;border-radius:4px}

.vx-road.r1{left:-10%;right:-10%;top:44%;height:10px;transform:rotate(-14deg)}

.vx-road.r2{top:-10%;bottom:-10%;left:46%;width:9px;transform:rotate(18deg)}

.vx-lake{position:absolute;right:8%;top:10%;width:34%;height:22%;border-radius:50%;background:#b9d8ec}

.vx-pin{position:absolute;z-index:2;transform:translate(-50%,-100%);font:inherit;font-size:.72rem;font-weight:800;padding:4px 8px;border-radius:8px;border:0;background:#5b3e9e;color:#fff;cursor:pointer;box-shadow:0 4px 10px #5b3e9e55;transition:transform .2s,background .2s}

.vx-pin:after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:inherit;border-top-color:#5b3e9e}

.vx-pin.on{background:var(--lime);color:#000;transform:translate(-50%,-100%) scale(1.12)}
.vx-pin.on:after{border-top-color:var(--lime)}

.vx-pop{position:absolute;left:10px;right:10px;bottom:10px;display:grid;gap:2px;padding:10px 12px;border-radius:8px;background:#fff;box-shadow:0 6px 18px #0000001f}

.vx-pop small{color:#77737f}

.vx-lock{margin:auto;padding:12px 14px;border-radius:8px;background:#fff;text-align:center;font-weight:700;font-size:.78rem;line-height:1.4;position:relative;z-index:2}

.vx-center{align-items:center;justify-content:center;text-align:center}

.vx-center small{color:#77737f}

.vx-demo[data-mode=a] .vx-n-b,.vx-demo[data-mode=b] .vx-n-a{display:none}

.vx-wa{padding:0;background:#efe7dc;gap:0}
.vx-wah{display:flex;gap:8px;align-items:center;padding:10px 12px;background:#1f7a5a;color:#fff}
.vx-wah i{flex:none;width:28px;height:28px;border-radius:50%;background:#5b3e9e;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:.7rem}
.vx-wah div{display:grid;line-height:1.2}
.vx-wah small{opacity:.8;font-size:.68rem}

.vx-wab{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px;scrollbar-width:none}
.vx-wab::-webkit-scrollbar{display:none}

.vx-wab p{margin:0!important;max-width:82%!important;padding:6px 9px;border-radius:8px;font-size:.75rem!important;font-weight:500!important;letter-spacing:0!important;line-height:1.35!important;animation:vxIn .25s both}

.vx-wab .in{align-self:flex-start;background:#fff;border-top-left-radius:2px}
.vx-wab .out{align-self:flex-end;background:#d4f7c6;border-top-right-radius:2px}
.vx-wab .typing{color:#77737f;font-style:italic}

.vx-qr{display:flex;flex-wrap:wrap;gap:5px;padding:8px 10px 4px}
.vx-qr button{font:inherit;font-size:.7rem;font-weight:700;border:1.5px solid #1f7a5a66;background:#fff;color:#1f7a5a;border-radius:999px;padding:4px 9px;cursor:pointer}

.vx-wa .vx-ok{padding:2px 10px 10px;font-size:.7rem}

.vx-doc{width:76px;height:96px;border-radius:6px;background:#fff;box-shadow:0 6px 16px #0000001a;padding:12px 10px;display:grid;gap:6px;align-content:start;margin-bottom:6px;border-top:10px solid #5b3e9e}

.vx-doc i{height:5px;border-radius:3px;background:#dcd6ea}
.vx-doc i.s{width:60%}

.vx-btn{font:inherit;font-weight:800;font-size:.8rem;border:0;border-radius:999px;padding:9px 16px;background:#5b3e9e;color:#fff;cursor:pointer;margin-top:4px;transition:background .25s,color .25s}

.vx-btn.done{background:var(--lime);color:#000}

.vx-btn.off{background:#b9b9c0;color:#fff;cursor:default}

.vx-ok{color:#2f7a4e!important;font-weight:700}

.vx-field{width:100%;max-width:180px;padding:8px 10px;border-radius:6px;border:1.5px solid #c4361f88;background:#fff;text-align:left;color:#9a9aa0;font-size:.72rem}

.vx-days,.vx-slots{display:flex;gap:6px;flex-wrap:wrap}

.vx-days button{border-radius:8px;display:grid;padding:4px 10px;line-height:1.15}
.vx-days button b{font-size:.95rem}

.vx-conf{margin:auto 0 0!important;padding:8px 10px;border-radius:8px;background:#efeaf8;color:#5b3e9e;font-weight:800!important;font-size:.78rem!important;max-width:none!important;line-height:1.3!important;letter-spacing:0!important;transition:background .25s}

.vx-conf.done{background:var(--lime);color:#000}

.vx-toast{padding:8px 10px;border-radius:8px;background:#fff;font-weight:700;font-size:.74rem;border-left:3px solid #c4361f;animation:vxShake 2.4s infinite}

.vx-toast:nth-child(3){animation-delay:.3s}
.vx-toast:nth-child(4){animation-delay:.6s}

@keyframes vxShake{0%,80%,100%{transform:none}
84%{transform:translateX(-3px)}
88%{transform:translateX(3px)}
92%{transform:translateX(-2px)}
}

.vx-cap{margin:16px 0 0!important;font-size:1rem!important;font-weight:500!important;letter-spacing:0!important;max-width:70ch!important;line-height:1.5!important;color:var(--grey);min-height:3em}

.vx-cap b{color:#fff}

@media (max-width:760px){
.vx-tiles{height:auto;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}

.vx-tiles::-webkit-scrollbar{display:none}

.vx-tile,.vx-tile.is-on{flex:0 0 78%;height:420px;scroll-snap-align:center}

.vx-tile .vx-ico{opacity:0}

.vx-demo[data-mode=a] .vx-tile .vx-a,.vx-demo[data-mode=b] .vx-tile .vx-b{opacity:1;transform:none;pointer-events:auto}

}

@media (prefers-reduced-motion:reduce){.vx-tile,.vx-scr,.vx-tl li,.vx-toast{transition:none!important;animation:none!important}
}


[data-pane]{display:none!important}
[data-pane].on{display:grid!important}
.vx-col[data-pane].on{display:flex!important}
.vx-scr .hide{display:none!important}
.vx-pill{justify-self:start}

.vx-col{flex-direction:column;gap:6px}

.vx-row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border-radius:8px;padding:8px 10px;font-size:.74rem}

.vx-row b{font-size:.78rem}
.vx-row small{color:#77737f}
.vx-row em{font-style:normal;font-weight:800;color:var(--acc,#5b3e9e)}

.vx-row.me{outline:2px solid var(--lime);outline-offset:-2px}

.vx-pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.66rem;font-weight:800;background:#e3f3e8;color:#2f7a4e}

.vx-pill.warn{background:#fde7e3;color:#c4361f}

.vx-steps{list-style:none;margin:0;padding:0;display:grid;gap:6px}

.vx-steps li{display:flex;gap:8px;align-items:center;background:#fff;border-radius:8px;padding:7px 10px;font-size:.74rem;opacity:.25;transform:translateX(-6px);transition:opacity .35s,transform .35s}

.vx-steps li i{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;background:#e3f3e8}

.vx-scr.lit .vx-steps li{opacity:1;transform:none}

.vx-scr.lit .vx-steps li:nth-child(2){transition-delay:.15s}
.vx-scr.lit .vx-steps li:nth-child(3){transition-delay:.3s}
.vx-scr.lit .vx-steps li:nth-child(4){transition-delay:.45s}

.vx-big{font-size:1.9rem;font-weight:900;letter-spacing:-.03em;line-height:1;color:var(--acc,#5b3e9e)}

.vx-bar{height:8px;border-radius:999px;background:#0000001a;overflow:hidden}
.vx-bar i{display:block;height:100%;width:42%;background:var(--acc,#5b3e9e);border-radius:inherit;transition:width .4s}

.vx-badges{display:flex;gap:6px;flex-wrap:wrap}

.vx-badge{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#0000000f;font-size:1.2rem;filter:grayscale(1);opacity:.45;transition:filter .3s,opacity .3s,transform .3s}

.vx-badge.got{filter:none;opacity:1;transform:scale(1.08);background:#fff3c4}

.vx-acc .vx-seg button,.vx-acc .vx-tap,.vx-acc .vx-inc{--c:var(--acc)}

.vx-seg{display:flex;gap:6px;flex-wrap:wrap}

.vx-seg button{font:inherit;font-size:.74rem;font-weight:700;border:1.5px solid color-mix(in srgb,var(--c,#5b3e9e) 40%,transparent);background:#fff;color:var(--c,#5b3e9e);border-radius:999px;padding:4px 10px;cursor:pointer;transition:background .2s,color .2s}

.vx-seg button.on{background:var(--c,#5b3e9e);color:#fff;border-color:var(--c,#5b3e9e)}

.vx-tap{font:inherit;font-weight:800;font-size:.8rem;border:0;border-radius:999px;padding:9px 16px;background:var(--c,#5b3e9e);color:#fff;cursor:pointer;transition:background .25s,color .25s;align-self:flex-start}

.vx-tap.done{background:var(--lime);color:#000}

.vx-center .vx-tap{align-self:center}

.vx-box{background:#fff;border-radius:10px;padding:10px 12px;display:grid;gap:4px}

.vx-box small{color:#77737f}

.vx-dim{color:#8a8a90!important}

.vx-kn{font-size:.95rem;font-weight:800}

.vx-say{display:flex;align-items:center;gap:8px}

.vx-say .vx-tap{padding:7px 12px}

.vx-logo{display:grid;place-items:center;flex:1;border-radius:8px;background:var(--bg);transition:background .35s;--bg:#4E2A16;--m1:#FFF8EC;--m2:#E2B95A}

.vx-logo svg{width:82%;height:auto}

.vx-logo [fill="#FFF8EC"]{fill:var(--m1);transition:fill .35s}
.vx-logo [stroke="#FFF8EC"]{stroke:var(--m1);transition:stroke .35s}
.vx-logo [stroke="#E2B95A"]{stroke:var(--m2);transition:stroke .35s}

.vx-scr[data-v=cream] .vx-logo{--bg:#F3EAD7;--m1:#4E2A16;--m2:#C9963A}

.vx-scr[data-v=dark] .vx-logo{--bg:#232323;--m1:#F3EAD7;--m2:#E2B95A}

.vx-qrc{width:92px;height:92px;border-radius:8px;background:
 conic-gradient(from 90deg at 25% 25%,#000 25%,#0000 0) 0 0/18px 18px,
 linear-gradient(#fff,#fff);border:6px solid #fff;outline:2px solid #000;margin:4px auto}

.vx-stars{font-size:1.1rem;letter-spacing:2px;color:#d9d9de;transition:color .3s}

.vx-scr.lit .vx-stars{color:#E2A21B}

.vx-gmap{flex:1;border-radius:8px;background:#e8efe4;position:relative;overflow:hidden;min-height:70px}

.vx-gmap .vx-road{opacity:.9}

.vx-gmap b.pin{position:absolute;left:52%;top:46%;transform:translate(-50%,-100%);font-size:1.4rem}

.vx-dash{display:grid;grid-template-columns:1fr 1fr;gap:6px}

.vx-dash div{background:#fff;border-radius:8px;padding:8px 10px;display:grid}

.vx-dash b{font-size:1.15rem;font-weight:900;color:var(--acc,#5b3e9e)}
.vx-dash small{color:#77737f;font-size:.68rem}

.vx-blank{flex:1;border-radius:8px;border:2px dashed #b9b9c0;display:grid;place-items:center;text-align:center;color:#8a8a90;font-weight:700;font-size:.78rem;padding:10px}



.ka-fab{position:fixed;right:18px;bottom:18px;z-index:60;font:inherit;font-weight:800;font-size:.9rem;padding:12px 18px;border-radius:999px;border:0;background:var(--lime);color:#000;box-shadow:0 10px 30px #0008;cursor:pointer;transition:transform .2s}

.ka-fab:hover{transform:translateY(-2px)}

html.ka-on #app{margin-left:min(520px,46vw)}

html.ka-on .top{position:sticky}

.ka{position:fixed;z-index:70;inset:0 auto 0 0;width:min(520px,46vw);font-family:var(--font);color:#ececf0;font-size:.92rem}

.ka-panel{height:100%;display:flex;flex-direction:column;background:#0d0d0f;border-right:1px solid #2a2a2e;box-shadow:12px 0 40px #0007}

.ka-top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #2a2a2e}

.ka-top b{font-size:1rem;flex:1}

.ka-dirty{font-size:.75rem;font-weight:700;color:#000;background:var(--lime);padding:3px 8px;border-radius:999px}

.ka-cols{flex:1;min-height:0;display:grid;grid-template-columns:170px minmax(0,1fr)}

.ka-side{overflow:auto;border-right:1px solid #2a2a2e;padding:10px 8px}

.ka-nav{display:grid;gap:2px}

.ka-nav>button,.ka-proj>button{font:inherit;text-align:left;border:0;background:none;color:#b8b8be;padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:8px;width:100%;min-width:0}

.ka-nav>button:hover,.ka-proj>button:hover{background:#1b1b1f;color:#fff}

.ka-nav>button.on,.ka-proj.on>button{background:#1f1f24;color:var(--lime);font-weight:700}

.ka-nav-h{margin:14px 10px 4px;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#77777f;font-weight:800}

    "sections": [
     {
      "col": 1,
      "h": "Context",
      "text": "ValueSpace.homes is a new real estate consultancy in Bengaluru with zero online presence. I helped the startup build one, and with it, the trust of the buyers it works with."
     },
     {
      "col": 1,
      "h": "Problem",
      "text": "Property buyers are wary online. Listing platforms sell their phone numbers, so they expect spam and distrust unknown callers. The site had to do more than list properties; it had to make a brand-new company feel trustworthy from the first visit."
     },
     {
      "col": 1,
      "h": "Solution",
      "text": "A complete property listing site built around one promise: we respect the buyer's time. Buyers browse projects and explore them on a map, see the details that matter before anyone calls, download brochures, and book site visits or online meetings at a time that suits them."
     },
     {
      "col": 2,
      "h": "What I did",
      "list": [
       "Designed the whole site end to end with my co-designer: information architecture, property listings and project pages, map-based search, booking flows and responsive layouts.",

       "Helped build the team — two designers and three developers — and ran the project: tasks, timelines and scope.",
       "Worked around real constraints: a team that kept changing and a scope that had to flex. We swapped a planned admin dashboard for a Google Sheets back end to ship on time.",
       "After launch, designed the landing pages and ran the Google Ads campaigns that brought buyers to the site."
      ]
     },
     {
      "col": 2,
      "h": "Outcome",
      "list": [

       "Started as a UX/UI design intern and ended up leading design and delivery.",
       "Once the site was live, one ad campaign brought in 114 leads from 1.49K clicks."
      ]

    "sections": [
     {
      "col": 1,
      "h": "Context",
      "text": "FreshLink is a fresh produce marketplace for Bengaluru that lets buyers trace every item back to the farm. It started as an internship brief, and I took it through to completion using AI at every stage."
     },
     {
      "col": 1,
      "h": "Problem",
      "text": "Research showed that trust, not access, is the real problem on both sides. Buyers can't tell how fresh produce is or who grew it. Farmers worry about when they'll be paid, whether the price will change, and whether they'll be cheated on weight or grade, and many find apps hard to use."
     },
     {
      "col": 1,
      "h": "Solution",
      "text": "I reframed the brief from \"another grocery app\" to a transparent fresh produce business, and designed that business before the screens. Farmers sell to FreshLink at a locked price, a hub grades every batch, and buyers see the harvest date, farm and grade before they buy."
     },
     {
      "col": 2,
      "h": "What I did",
      "list": [
       "Followed the Double Diamond with AI doing the heavy lifting: Claude and ChatGPT simulated stakeholder and customer interviews, all labelled as AI-generated. I set the questions and made the calls.",
       "Checked every market number against its source, and made the AI argue against its own insights before I accepted them.",
       "Built two personas in UXPressia, a Bengaluru buyer and a farmer near Chikkaballapura, with journey maps showing where trust is won or lost.",
       "Designed the business ecosystem before any screens: who does what at each of the six stages from farm to fork, and the value each stage creates for farmers, FreshLink and buyers.",
       "Made the key business decisions, such as a hybrid procurement model with prices locked before pickup and a grading hub as the quality gate.",
       "Created the brand and design system.",
       "Designed the consumer app, a farmer portal in Kannada with a listen button on every screen and no typing, and an operations dashboard."
      ]
     },
     {
      "col": 2,
      "h": "Outcome",
      "list": [
       "Next: usability tests with real buyers, farmers and ops staff, and a native-speaker review of the Kannada copy.",
       "Biggest lesson: AI agrees too easily. Simulated interviews are hypotheses, not evidence — real users come next."
      ]
     }

    "sections": [
     {
      "col": 1,
      "h": "Context",
      "text": "Fitverse is a mobile app that encourages teenagers to stay active, eat better and build confidence in their fitness journey."
     },
     {
      "col": 1,
      "h": "Problem",
      "text": "Most fitness apps are built for adults. For teens, workouts feel like a chore, plans don't fit around school and sport, and there's little to keep them coming back."
     },
     {
      "col": 1,
      "h": "Solution",
      "text": "Short, fun, equipment-free workouts made for teens, including mood-based and sports-inspired routines. Badges, streaks and challenges keep them motivated, while leaderboards and group challenges bring friends in. Personalised plans and nutrition tips round it out, without pressure."
     },

      ]

window.KS_wire=function(root){
 function all(r,s){return [].slice.call(r.querySelectorAll(s))}
 all(root,'.vx-demo').forEach(function(d){

 var lab='<label for="'+id+'">'+E(f.l)+'</label>';
 if(f.t==='text')return '<div class="ka-f">'+lab+'<input id="'+id+'" data-p="'+E(path)+'" value="'+E(v)+'">'+help+'</div>';

 if(f.t==='lines')return '<div class="ka-f">'+lab+'<textarea id="'+id+'" rows="4" data-p="'+E(path)+'" data-lines="1">'+E((v||[]).join('\n'))+'</textarea>'+help+'</div>';

 var y=window.scrollY;window.KS.render(DATA,document.getElementById('app'),{keep:true});showPreview();window.scrollTo(0,y);lsSet(JSON.stringify(DATA)===SAVED?null:JSON.stringify(DATA));bar()},now?0:250)}
function showPreview(){
 var v=sel.sec==='proj'?(DATA.projects[sel.pi]||{}).slug:SECTIONS[sel.sec].view;
 var vs=[].slice.call(document.querySelectorAll('#app .view')),ok=vs.some(function(x){return x.dataset.view===v});
 if(sel.sec==='proj'&&DATA.projects[sel.pi]&&DATA.projects[sel.pi].show===false)ok=false;
 vs.forEach(function(x){x.hidden=x.dataset.view!==(ok?v:'home')});
 var n=document.querySelector('.ka-pv-note');if(n)n.hidden=ok||sel.sec!=='proj';
}

/* ---------- events ---------- */
function onInput(e){var t=e.target;
 if(t.dataset.sync){var tx=document.getElementById(t.dataset.sync);tx.value=t.value;tx.dispatchEvent(new Event('input',{bubbles:true}));return}
 if(!t.dataset.p)return;
 var v=t.dataset.bool?t.checked:t.dataset.lines?t.value.split('\n').map(function(s){return s.trim()}).filter(Boolean):t.value;
 if(/\.col$/.test(t.dataset.p))v=+v;
 if(/^projects\.\d+\.slug$/.test(t.dataset.p))v=slugify(v);
 set(DATA,t.dataset.p,v);
 var sw=t.parentNode.querySelector('.ka-sw');if(sw)sw.style.background=t.value;
 if(/^projects\.\d+\.name$/.test(t.dataset.p)){var h2=document.querySelector('.ka-body h2');if(h2)h2.textContent=v}
 if(/\.name$/.test(t.dataset.p)||/\.show$/.test(t.dataset.p)||/tone\.bg$/.test(t.dataset.p))document.querySelector('.ka-side').innerHTML=nav();
 preview();
}
function arrAt(path){return get(DATA,path)}
function onClick(e){var b=e.target.closest('button');if(!b)return;var d=b.dataset,x;
 if(d.sec){sel={sec:d.sec,pi:0,tab:'card'};paint();window.scrollTo(0,0);preview(true);return}
 if(d.proj!=null){sel={sec:'proj',pi:+d.proj,tab:sel.sec==='proj'?sel.tab:'card'};paint();window.scrollTo(0,0);preview(true);return}
 if(d.tab){sel.tab=d.tab;paint();showPreview();if(d.tab!=='card')scrollPreviewTo(d.tab);return}
 if(d.add){var f=findList(d.add),arr=arrAt(d.add)||[];arr.push(clone(f.blank));set(DATA,d.add,arr);sel.openItem=d.add+'.'+(arr.length-1);paint(true);preview();return}
 if(d.mv){x=d.mv.split('|');var A=arrAt(x[0]),i=+x[1],j=i+(+x[2]);if(j<0||j>=A.length)return;A.splice(j,0,A.splice(i,1)[0]);e.preventDefault();paint(true);preview();return}
 if(d.dup){x=d.dup.split('|');var A2=arrAt(x[0]);A2.splice(+x[1]+1,0,clone(A2[+x[1]]));e.preventDefault();paint(true);preview();return}
 if(d.del){e.preventDefault();if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='Sure?';setTimeout(function(){b.classList.remove('arm');b.textContent='✕'},2500);return}
  x=d.del.split('|');arrAt(x[0]).splice(+x[1],1);paint(true);preview();return}
 if(d.padd){var np=blankProject(DATA.projects.length+1);while(DATA.projects.some(function(p){return p.slug===np.slug}))np.slug+='-x';DATA.projects.push(np);sel={sec:'proj',pi:DATA.projects.length-1,tab:'card'};paint();preview();status('New project added. It stays hidden until you tick “Published”.','');return}
 if(d.pmv){x=d.pmv.split('|');var P=DATA.projects,pi=+x[0],pj=pi+(+x[1]);if(pj<0||pj>=P.length)return;P.splice(pj,0,P.splice(pi,1)[0]);if(sel.sec==='proj'&&sel.pi===pi)sel.pi=pj;paint(true);preview();return}
 if(d.pdup){var cp=clone(DATA.projects[+d.pdup]);cp.slug+='-copy';cp.name+=' (copy)';cp.show=false;DATA.projects.splice(+d.pdup+1,0,cp);sel.pi=+d.pdup+1;paint();preview();return}
 if(d.pdel){if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='Click again to delete';setTimeout(function(){b.classList.remove('arm');b.textContent='Delete project'},3000);return}
  DATA.projects.splice(+d.pdel,1);sel={sec:'site',pi:0,tab:'card'};paint();preview();return}
 if(d.clear){set(DATA,d.clear,'');paint(true);preview();return}
 if(b.classList.contains('ka-save'))return save();
 if(b.classList.contains('ka-close'))return close();
 if(b.classList.contains('ka-revert')){DATA=JSON.parse(SAVED);lsSet(null);paint();preview(true);status('Changes discarded.','');return}
 if(b.classList.contains('ka-export'))return exportFile('site.json',JSON.stringify(DATA,null,1),'application/json');
 if(b.classList.contains('ka-exporthtml')){status('Preparing your site file…','');return standalone().then(function(h){exportFile('index.html',h,'text/html')})}
 if(b.classList.contains('ka-import'))return document.querySelector('.ka-importf').click();
 if(b.classList.contains('ka-pvtoggle'))return document.querySelector('.ka').classList.toggle('pv');
}
function scrollPreviewTo(tab){var v=document.querySelector('#app .view:not([hidden])');if(!v)return;var el=tab==='summary'?v.querySelector('.summary'):tab==='demo'?v.querySelector('.vx-demo'):v.querySelector('.case-statement');if(el)el.scrollIntoView({block:'start'})}
function findList(path){var parts=path.split('.'),fs=sel.sec==='proj'?PTABS[sel.tab].f:SECTIONS[sel.sec].f;
 var key=sel.sec==='proj'?parts.slice(2).join('.'):path;key=key.replace(/\.\d+\./g,'.');
 function walk(list,pre){for(var i=0;i<list.length;i++){var f=list[i];if(f.t!=='list')continue;var k=pre?pre+'.'+f.k:f.k;if(k===key)return f;var r=walk(f.f,k);if(r)return r}}
 return walk(fs,'')}
function onChange(e){var t=e.target;
 if(t.dataset.snip&&t.value){var ta=t.closest('.ka-screen').querySelector('textarea');var s=SNIP[t.value];
  var pos=ta.selectionStart!=null&&document.activeElement===ta?ta.selectionStart:ta.value.length;ta.value=ta.value.slice(0,pos)+s+ta.value.slice(pos);t.value='';ta.dispatchEvent(new Event('input',{bubbles:true}));return}
 if(t.dataset.up&&t.files&&t.files[0]){var path=t.dataset.up;status('Uploading…','');
  var fl=t.files[0],nk=t.dataset.name;ASSETS.upload(fl).then(function(r){set(DATA,path,r.url);if(nk&&!get(DATA,nk))set(DATA,nk,fl.name);paint(true);preview();status('Uploaded. Publish to make it live.','ok')}).catch(function(err){status('Upload failed: '+(err&&err.message||err),'err')});return}
 if(t.classList.contains('ka-importf')&&t.files[0]){t.files[0].text().then(function(tx){try{var j=JSON.parse(tx);if(!j.site||!j.projects)throw new Error('Not a portfolio file');DATA=j;paint();preview(true);status('Imported. Review it, then publish.','ok')}catch(err){status('Could not import: '+err.message,'err')}});t.value=''}
}

/* ---------- save / export ---------- */
function save(){if(!ART)return;var b=document.querySelector('.ka-save');b.disabled=true;b.textContent='Publishing…';status('','');
 var json=JSON.stringify(DATA,null,1);
 ART.publish({'site.json':{content:json,contentType:'application/json'}}).then(function(){SAVED=JSON.stringify(DATA);lsSet(null);bar();status('Published. Everyone now sees the new version.','ok')}).catch(function(err){
  var c=err&&err.code;bar();
  if(c==='conflict')status('Someone published a newer version, so the page is reloading. Your draft is kept in this browser.','err');
  else if(c==='not_writer'||c==='not_granted'||c==='capability_disabled'||c==='consent_required')status('Saving isn’t available in this view. Use Export to keep your changes.','err');
  else if(c==='too_large')status('The site data is too large to save.','err');
  else if(c==='rate_limited')status('Too many saves in a row. Wait a moment and try again.','err');
  else status('Couldn’t publish ('+(c||'error')+'). Try again in a moment.','err')})}
function exportFile(name,text,type){
 if(DL){DL.save({filename:name,data:new Blob([text],{type:type})}).then(function(){status('Saved '+name+'.','ok')}).catch(function(){status('Download cancelled.','')});return}
 try{var u=URL.createObjectURL(new Blob([text],{type:type})),l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(u)},2000)}catch(e){status('Download isn’t available here.','err')}}
function blobToData(u){return fetch(u).then(function(r){if(!r.ok)throw 0;return r.blob()}).then(function(b){return new Promise(function(res){var fr=new FileReader();fr.onload=function(){res(fr.result)};fr.onerror=function(){res(u)};fr.readAsDataURL(b)})}).catch(function(){return u})}
function standalone(){
 var css=document.getElementById('site-css').textContent, js=document.getElementById('site-js').textContent;
 var json=JSON.stringify(DATA), blobs=json.match(/\/_blob\/[A-Za-z0-9_-]+/g)||[], uniq=blobs.filter(function(x,i){return blobs.indexOf(x)===i});
 var an=DATA.site.analytics!==false?'<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)}<\/script><script defer src="/_vercel/insights/script.js"><\/script>':'';
 return Promise.all(uniq.map(blobToData)).then(function(datas){
  var d=JSON.parse(json);var str=JSON.stringify(d);uniq.forEach(function(u,i){str=str.split(u).join(datas[i])});
  return '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>'+E(DATA.site.title)+'</title><style id="site-css">'+css+'</style><style id="theme-css"></style>'+an+'</head><body><div id="app"></div><script type="application/json" id="seed">'+str.replace(/</g,'\\u003c')+'<\/script><script id="site-js">'+js+'<\/script></body></html>'})}

/* ---------- open / close ---------- */
function shell(){
 var w=document.createElement('div');w.className='ka';w.innerHTML='<div class="ka-panel"><div class="ka-top"><b>Portfolio dashboard</b><span class="ka-dirty" hidden>Unpublished changes</span><a class="ka-sm ka-stats" target="_blank" rel="noreferrer" hidden>📊 Visitors</a><button type="button" class="ka-pvtoggle ka-sm">Preview</button><button type="button" class="ka-close ka-sm" title="Close">Close</button></div>'+
  '<div class="ka-cols"><div class="ka-side"></div><div class="ka-body"></div></div>'+
  '<div class="ka-foot"><button type="button" class="ka-save">Published</button><button type="button" class="ka-sm ka-revert">Discard changes</button><span class="ka-more"><button type="button" class="ka-sm ka-export">Export data</button><button type="button" class="ka-sm ka-import">Import</button><button type="button" class="ka-sm ka-exporthtml">Download site HTML</button><input type="file" class="ka-importf" accept="application/json" hidden></span><p class="ka-status" role="status"></p></div></div>'+
  '<p class="ka-pv-note" hidden>This project is hidden. Tick “Published” on the Card tab to see it here.</p>';
 document.body.appendChild(w);
 w.addEventListener('input',onInput);w.addEventListener('change',onChange);w.addEventListener('click',onClick);
}
function openAdmin(){if(open)return;open=true;document.documentElement.classList.add('ka-on');
 if(!document.querySelector('.ka'))shell();
 var dr=lsGet();if(dr==='stale'){setTimeout(function(){status('An older unpublished draft in this browser was out of date, so it was discarded. You are editing the latest published version.','')},50)}else if(dr){try{var j=JSON.parse(dr);if(JSON.stringify(j)!==SAVED){DATA=j;setTimeout(function(){status('Restored your unpublished draft from this browser.','')},50)}}catch(e){}}
 document.querySelector('.ka').hidden=false;paint();preview(true);
 if(!ART)status('Saving isn’t available in this view. Edits are kept in this browser; use Export to download them.','err');
}
function close(){open=false;document.documentElement.classList.remove('ka-on');document.querySelector('.ka').hidden=true;
 if(dirty)window.KS.render(JSON.parse(SAVED),document.getElementById('app'));if(location.hash==='#admin')history.replaceState(null,'',location.pathname+location.search);
 var fb=document.querySelector('.ka-fab');if(fb)fb.hidden=false}

window.KS_admin=function(data){
 DATA=clone(data);SAVED=JSON.stringify(data);
 if(!(window.claude&&claude.use))return;
 claude.use('user').then(function(u){
  if(!(u&&(u.isOwner()||u.canEdit())))return;
  var fab=document.createElement('button');fab.type='button';fab.className='ka-fab';fab.innerHTML='✎ Edit site';fab.onclick=function(){fab.hidden=true;openAdmin()};document.body.appendChild(fab);
  if(location.hash==='#admin'){fab.hidden=true;openAdmin()}
  window.addEventListener('hashchange',function(){if(location.hash==='#admin'){fab.hidden=true;openAdmin()}});
 });
 claude.use('artifact').then(function(a){ART=a;bar()});
 claude.use('assets').then(function(a){ASSETS=a});
 claude.use('downloads').then(function(d){DL=d});
};
})();

(function(){
 var app=document.getElementById('app'),seed=JSON.parse(document.getElementById('seed').textContent),done=false;
 function go(d){if(done)return;done=true;window.KS.render(d,app);window.KS_admin&&window.KS_admin(d)}
 var t=setTimeout(function(){go(seed)},2500);
 try{fetch('site.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){clearTimeout(t);go(d&&d.site&&d.projects?d:seed)},function(){clearTimeout(t);go(seed)})}catch(e){clearTimeout(t);go(seed)}
})();
